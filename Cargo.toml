[package]
name = "amazing-backup"
version = "0.1.0"
edition = "2024"
description = "Encrypt backup archives with age and store them in S3 versioned buckets with issued-UUID keys, indexing, pinning and lifecycle management"
license = "MIT"
readme = "README.md"
repository = "https://github.com/TomoTom0/amazing-backup"
keywords = ["backup", "s3", "age", "encryption", "archive"]
categories = ["command-line-utilities", "backup"]

[dependencies]
clap = { version = "4", features = ["derive"] }
# completionsサブコマンドの補完script生成(TASK-2設計D-1。runtime用・feature分岐なし)
clap_complete = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sha2 = "0.10"
base64 = "0.22"
chrono = "0.4"
uuid = { version = "1", features = ["v7"] }
aws-sdk-s3 = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time", "fs", "io-util"] }

[dev-dependencies]
# capture_request検証用(設計4.3案4・12.1)。capture_request関数の実体はこのSDK版では
# aws-smithy-http-client(test-util)にあり、aws-smithy-runtime(test-util)は設計12.1どおりの基盤feature
aws-smithy-runtime = { version = "1", features = ["test-util"] }
aws-smithy-http-client = { version = "1", features = ["test-util"] }
