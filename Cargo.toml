[package]
name = "amazing-backup"
version = "0.1.0"
edition = "2024"
description = "Encrypt backup archives with age and store them in S3 versioned buckets with issued-UUID keys, indexing, pinning and lifecycle management"
license = "MIT"
readme = "README.md"
repository = "https://github.com/TomoTom0/amazing-backup"
keywords = ["backup", "s3", "age", "encryption", "archive"]
categories = ["command-line-utilities", "backup"]

[features]
default = ["serve"]
# TASK-9設計1章(D2承認): serve関連依存は`serve` featureに括りdefault featuresへ含める
# (cargo install/mise導線で`--features serve`指定を不要にする)。
# webauthn-rs・tower-sessionsはP4(passkey認証)で導入する(P2では未使用のため省く)。
serve = [
  "dep:axum",
  "dep:tower-http",
  "dep:rust-embed",
  "tokio/net",
  "tokio/signal",
]

[dependencies]
clap = { version = "4", features = ["derive"] }
# completionsサブコマンドの補完script生成(TASK-2設計D-1。runtime用・feature分岐なし)
clap_complete = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sha2 = "0.10"
base64 = "0.22"
chrono = "0.4"
uuid = { version = "1", features = ["v7"] }
aws-sdk-s3 = "1"
# SdkError::ServiceErrorのcode/message/status診断(TASK-26)。SDK中核crateのため実質size影響なし
aws-smithy-runtime-api = "1"
tokio = { version = "1", features = ["rt-multi-thread", "time", "fs", "io-util"] }
# TASK-9 local catalog DB(D1承認: SQLite)。DB層はCLI・serve共用のため無条件依存。
# bundledでlibsqlite3を同梱build(外部libsqlite3への依存無し)
rusqlite = { version = "0.40", features = ["bundled"] }
# schema migration(user_version方式)。rusqlite 0.40系と組合わせる(links衝突回避)
rusqlite_migration = "2.6.0"
# TASK-9設計1章(serve feature): HTTP層axum(0.8系)
axum = { version = "0.8", optional = true }
# TASK-9設計1章(serve feature): API応答のCache-Control付与(set-headerのみ有効化)
tower-http = { version = "0.6", optional = true, default-features = false, features = ["set-header"] }
# TASK-9設計10章(serve feature): frontend/distのbinary埋め込み。allow_missingはderive属性
# (#[allow_missing = true])で付与しdist欠落でもbuild可能(欠落時は空assets=静的配信なし)
rust-embed = { version = "8", optional = true }

[dev-dependencies]
# capture_request検証用(設計4.3案4・12.1)。capture_request関数の実体はこのSDK版では
# aws-smithy-http-client(test-util)にあり、aws-smithy-runtime(test-util)は設計12.1どおりの基盤feature
aws-smithy-runtime = { version = "1", features = ["test-util"] }
aws-smithy-http-client = { version = "1", features = ["test-util"] }
