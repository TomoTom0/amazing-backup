# backup-remote テスト設計条件書(pin エリア)
# 出典: tmp/tasks/tm-10/design_s3_storage.md 1.3・3.2(pin add/rm・backup push --pin)・8.1・9章素案(TASK-10 S3ストレージ設計)
# 2026-10-14: TASK-10実装(Phase A)に先立つテスト先行の条件書(新設feature)。
#   pin実装はcli.rs(コマンド)+uploader.rs(pin upload)+index.rs(索引更新)+s3.rs(copy_object)に跨る。
#   実装前のため条件に対応するテストコードは未作成(網羅検査は警告のみの段階)。
# 2026-10-15: TASK-11(Phase B低残件)対応でテスト先行の更新(TASK-11 body):
#   pin.rm-updates-indexを文言改訂: pin rmの削除はversion実体の削除(DeleteObjectVersion相当。
#   delete marker付与のみで実体がnoncurrentに残る形でない)とし、diffのpins報告と整合
#   (削除済みpinは存在しない)。実装前のため改訂期待値のテストは実行failを許容し[meta]はverified=falseのまま。
# 2026-10-15: TASK-11(Phase B)でPhase A実装済み・未条件化の振る舞いを事後条件化(回帰テスト)。
#   新規1件: pin.push-pin-on-skip-targets(M-6: skip対象がある場合のbackup push --pinは警告表示+
#   当該fileの最新版へCopyObjectでpin付与)。出典はtmp/tasks/tm-10/design_s3_storage.md 12章。

[meta]
feature = "pin"
source_file = "src/cli.rs"
verified = false
test_command = "cargo test"
note = "TASK-10(9章素案+設計1.3/3.2本文)の条件化。pin objectは <prefix>/<category>[/<rel_path>]/<name>/<pin-name>.age(別key写し・6章確定)。source_fileはエリア主対象としてcli.rs(pin add/rmコマンド)を指し、写し・削除のS3 API実体(src/s3.rs・src/uploader.rs)と索引更新(src/index.rs)はtarget_functionで特定(config.tomlのCONF-005と同一運用)"

[[condition]]
id = "pin.add-writes-pin-key-from-version"
target_function = "cli::cmd_pin_add"
source = "tmp/tasks/tm-10/design_s3_storage.md 3.2(pin add)・1.3(ピン留め規則)"
description = "pin add正常系: --latest/--version で対象versionを解決し、未復元時は復元jobを発行、復元済み版をCopyObjectでpin key(<prefix>/<category>[/<rel_path>]/<name>/<pin名>.age)へ写す。storage classはfile objectと同じ(profileのstorage_class)。索引更新+registry記録(新record_type pin_write) (integration, fake seam)"
given = "未復元(DEEP_ARCHIVE)の版への pin add と、復元済み版への pin add --as pre-migration"
expect_return_shape = "未復元版は復元job発行後に写しが行われ(進行中は案内)、復元済み版は即時にCopyObjectでpin keyへ写る。storage_class=<profile値>。索引pins[]とregistryのpin_write記録が更新される"
source_lines = "tests/pin.rs:36"

[[condition]]
id = "pin.write-once-violation-rejected"
target_function = "cli::cmd_pin_add / uploader(head確認)"
source = "tmp/tasks/tm-10/design_s3_storage.md 1.3(write-once)"
description = "write-once違反: 既存pin keyへのPUTはhead確認で検出して拒否(対象エラー3)。上書きしたい場合はpin rm後に再付与という案内を表示 (integration, fake seam)"
given = "同一pin名が既に存在する状態での pin add --as <既存pin名> 実行"
expect_return_shape = "exit 3(対象エラー)。既存pin objectは不変で、pin rm後の再付与を案内する表示が出る"
source_lines = "tests/pin.rs:209"

[[condition]]
id = "pin.copy-oversize-uses-uploadpartcopy"
target_function = "s3 copy(copy_object / UploadPartCopy)"
source = "tmp/tasks/tm-10/design_s3_storage.md 1.3・11章S3-3・8.1(s3.rs行)"
description = "後付けpinのCopyObjectは1回5GB上限のため、5GB超の版はUploadPartCopyで分割写しとする(backup時ピンは同制約を受けない) (integration, fake seam)"
given = "source versionが5GB超の版への pin add と、5GB以内の版への pin add"
expect_return_shape = "5GB超はCopyObject(単発)ではなくCreateMultipartUpload→UploadPartCopy×N→CompleteMultipartUploadの呼び出しでpin keyへ写る。5GB以内は単発CopyObject"
source_lines = "tests/pin.rs:127"

[[condition]]
id = "pin.backup-time-pin-upload"
target_function = "cli::cmd_backup_push --pin / uploader(pin upload)"
source = "tmp/tasks/tm-10/design_s3_storage.md 3.2(backup push --pin)・1.3"
description = "backup push --pin <版名>: uploadと同時にpin keyへ書き込まれる(復元job不要・CopyObject 5GB上限の制約を受けない直接upload。5GB超対象でも可。storage_classはprofile値) (integration, fake seam)"
given = "backup push <対象> --pin pre-migration 実行"
expect_return_shape = "default.age と pin key(<pin名>.age)の両方がPUTされ(CopyObjectは使われない)、索引pins[]へ反映される"
source_lines = "tests/pin.rs:242"

[[condition]]
id = "pin.rm-updates-index"
target_function = "cli::cmd_pin_rm"
source = "tmp/tasks/tm-10/design_s3_storage.md 3.2(pin rm)。TASK-11 body(Phase B低残件: pin rm実体削除とdiff整合)"
description = "pin rm: pin objectを削除し索引から該当pin entryを除去。削除はversion実体の削除(DeleteObjectVersion相当・delete marker付与のみで実体がnoncurrentとして残る形でない)とし、削除後のdiffのpins報告と整合する(削除済みpinは存在しない)。DEEP_ARCHIVE配置のpinも復元不要で削除できる (integration, fake seam)"
given = "pinが付与済み(DEEP_ARCHIVE配置)のfileへの pin rm --pin <版名> 実行後の ListObjectVersions 確認と diff 実行"
expect_return_shape = "復元jobなしでpin objectのversion実体が削除され(ListObjectVersionsに当該pin keyが現れない)、索引pins[]から該当entryが除去され、registryへpin_remove記録され、diffは当該pinを存在しないものとして報告し exit 0"
source_lines = "tests/pin.rs:305"

[[condition]]
id = "pin.add-requires-config-early"
target_function = "pin add(起動時検査)"
source = "tmp/tasks/tm-10/design_s3_storage.md 3.2(pin add)・レビューM-4"
description = "pin add/rmはregistryへの記録を要するため--config(pipeline.toml)必須。S3変更(copy_object等)より前に設定エラー2で拒否されS3 API呼び出しは行われない(copy後にregistry解決失敗するとwrite-once滞留で手詰まりになるのを防ぐ) (integration, fake seam)"
given = "--aws-configのみで--config/--keyなしのpin add実行"
expect_return_shape = "exit 2(設定エラー)かつS3 API呼び出しなし(calls.log空)"
source_lines = "tests/storage_backup.rs:676"

[[condition]]
id = "pin.push-pin-on-skip-targets"
target_function = "backup push --pin(skip対象へのpin付与)"
source = "tmp/tasks/tm-10/design_s3_storage.md 12章レビューM-6(Phase A実装済み・事後条件化)・3.2(backup push --pin)"
description = "backup push --pinで対象に変更なし(skip)のfileが含まれる場合は、新規upload分のpinと同時にskip対象にも警告表示(WARNING: 変更なしfileの件数と最新版へのpin付与を通知)のうえ、当該fileの最新版(索引versions先頭)へCopyObjectでpinを付与する(skip対象がpinなしになるのを防ぐ)。skip対象の当該pin keyが既に存在する場合はwrite-onceに従い付与をskipする警告を出す (integration, fake seam)"
given = "1度push済みのfile(再実行でskip)と新規fileを同時に指定した backup push --pin <版名> 実行"
expect_return_shape = "exit 0。skip表示とWARNING表示があり、新規分はpin keyへの直接PUT・skip分は当該fileのdefault.age最新版からCopyObjectでpin keyへ写され、索引pins[]に双方反映される"
source_lines = "tests/pin.rs:360"
