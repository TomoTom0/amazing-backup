[[condition]]
id = "encrypt.skip-by-registry-record"
target_function = "registry基準skip判定(backup pushの所在skip)"
source = "tmp/tasks/tm-10/design_s3_storage.md 8.1(registry.rs行)・8.3・9章素案。TASK-18(tmp/tasks/tm-18/design_key-uuid-versioning.md 4.1(1)(所在skip/uuid再利用判定)・10章): skip条件のuuid照合置換へ改訂"
description = "encrypt skip判定のregistry基準化: skip条件はfile_write成功記録一致(identity_hash+size+mtime)かつfile_upload記録が存在(u.uuid == w.uuid照合+bucket一致。現行のs3_key==p.s3_key比較の置換=所在skipはuuid解決を要しないregistry側uuid照合)。.age不在でもskipされる(cache dir掃除(keep_artifacts=\"run\")後の再実行で重複暗号化が起きない)。file_write一致でもfile_upload無し(crash残存)はskipせず(2.5)再PUT分岐へ進む(振る舞いはcli.backup-push-crash-reput-same-uuidで担保) (unit)"
