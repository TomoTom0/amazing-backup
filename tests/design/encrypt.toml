source = "tmp/tasks/tm-1/design_backup_pipeline.md 8章 ENC-005(照合仕様は4.4・6.3)"
description = "暗号化直後のヘッダ照合: ssh-ed25519 stanza数がrecipient数と一致し、各stanza第1引数が対応recipientの指紋prefix(b64(SHA-256(blob)先頭4byte))と完全一致する(実age v1.2.1形式)。実装の自己検証(6.3)は旧32byte tag形式とv1.2形式の両方を受け付ける (integration)"
given = "公開鍵2本で暗号化した .age のヘッダ(実age v1.2.1の -> ssh-ed25519 <指紋prefix> <ephemeral鍵> 形式)と、同一鍵群から計算した指紋prefix"
expect_no_throw = "encrypt_stream は自己検証(旧/v1.2両形式対応)を通過し Err を返さない。かつparseしたヘッダは stanza数==recipient数・各第1引数==b64(SHA-256(blob)[:4])・第2引数(ephemeral 32byte)を伴う"
source_lines = "tests/age_roundtrip.rs:141"

