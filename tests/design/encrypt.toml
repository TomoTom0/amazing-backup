[[condition]]
id = "encrypt.reencrypt-on-source-change"
target_function = "registry(skip指紋判定)/ backup push(sha照合)"
source = "tmp/tasks/tm-1/design_backup_pipeline.md 8章 ENC-011(規則は2.2-2・4.1 reduce)。TASK-11(Phase B): 旧encrypt削除によりbackup push経路へ文言改訂。TASK-18(tmp/tasks/tm-18/design_key-uuid-versioning.md 4.3(mtimeのみ変化)・10章): sha合流経路(uploadなし)へ改訂"
description = "sourceのsize/mtime変化時は再暗号化(平文sha256入手)のうえsha照合へ進み、内容同一なら既存uuidへ合流: default.ageへのuploadなし・版増加なしでfile_write新記録が追記されreduce後勝ちになる(次回から所在skipが回復) (integration)"
given = "過去file_write記録がある対象のsize/mtimeを変更(内容不変: mtimeのみ変化を含む)して backup push 再実行"
expect_return_shape = "再暗号化されsha照合で合流し、default.ageへのPUTは行われず(版増加なし)、reduce後の状態で新記録が有効(age_sha256等が新値・旧記録は参照されない)"
source_lines = "src/registry.rs:859; tests/encrypt_batch.rs:192"

