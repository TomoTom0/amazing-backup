[meta]
feature = "encrypt"
source_file = "src/crypto.rs"
verified = true
verified_at = "2026-10-23"
verified_by = "claude"
test_command = "cargo test"
source_hash = "b06e73e581cb55ea8d886a5a3edfa802d0f60b11"
note = "暗号化経路(crypto.rs)・registry記録・manifest構築の条件群。TASK-11(Phase B)で旧encryptサブコマンドが削除され、暗号化はbackup push(暗号化→upload→manifest→索引更新の統合run)経路で検証する。(integration)は実ageバイナリ前提(設計8章)"

[[condition]]
