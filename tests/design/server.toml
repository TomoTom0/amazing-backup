source = "TASK-17設計(tmp/tasks/tm-17/design_webui-overall.md) 4.1(audit_log table=UI書込操作の履歴。id/scope/recorded_at/action/detail_json/outcome/error_code)・2.5(操作履歴=日時・操作種・対象・成否)・D-W10(UI書込操作のみ記録=CLI操作は記録しない)・6.2・9章W2行(audit_log table+書込APIでの記録)"
description = "W2の書込API(tags系・collections系)はUI書込操作としてaudit_logへ記録される: 成功操作はoutcome=\"ok\"・失敗操作(422・409等)も記録されoutcome=\"failed\"+error_code(2.5の成否表示の基盤)。成功audit記録は書込操作と同一transactionで確定し・audit記録が不能な場合は操作もrollbackされて500 internal errorで応答する=成功応答した変更が履歴に残らない状況を作らない(2026-11-14コードレビュー中4対応。SQLite local DBでinsert失敗=disk障害時は操作も失敗が自然なため。失敗audit(422/409/404時)は操作が行われていないため別transactionでよい)。書込flow内のstorage層失敗も監査記録の共通経路を通る(failed/internal記録後に500=コードレビュー中5対応)。各列はscope(=実効scopeのbucket:prefix形式)・recorded_at(非空)・action(操作種別)・detail_json(対象特定情報(uuid・collection id/name等)を含むJSON文字列)。action語彙(設計に規定されない点の解釈): tags_replace/collection_create/collection_rename/collection_delete/collection_items_add/collection_items_remove (unit, fake seam)"
