# amazing-backup テスト設計条件書(server エリア)
# 出典: tmp/tasks/tm-9/design_catalog-frontend-auth.md 1章(全体構成・D2)・6章(API設計)・
#   8章(server.toml)・9章(公開範囲・D4)・10章(build・配布)・12章 Phase P2(serve基盤)・
#   12章 Phase P3(読取API)。
#   D1〜D11は2026-11-05ユーザー承認済み。port割当はD5確定値(40510=本番serve・40511=stg・
#   40512=Vite dev server・40513-40514=予備。範囲はユーザー指定・割当はserver.toml/vite.config.ts管理)。
# 2026-11-04: TASK-9 Phase P2(serve基盤)対応でテスト先行の条件書(新設feature)。
#   src/server.rs は設計12章P2で新設されるmodule(axum serve・rust-embed静的配信)。
#   実装前のため新条件のテストは実行failを許容(serve subcommand未実装=exit 64で
#   起動失敗・HTTP応答なし。cargo test --no-runのcompileは通る)。
#   src/server.rs内のunit test(handler単位)はP3実装時に追加する方針。
#   既存config.tomlのconfig init系条件(id不変)へserver.toml生成分の文言改訂が必要になるが、
#   これはP2実装工程での追随とする(2026-10-29 TASK-1「実装工程の対応のため本更新では未触」と
#   同一運用。本条件書のserver.config-init-generates-server-tomlが追加生成分の本体を担保)。
# 2026-11-05: TASK-9 Phase P3(読取API)対応でテスト先行の条件追加(11条件)。
#   excluded「読取API endpoint群とerror体系」を解消し6章のendpoint一覧からP3対象
#   (読取系+軽操作)を条件化。テストはsrc/server.rs内#[cfg(test)]のhandler単体test
#   (router oneshot・設計11章「API handler(in-memory DB+axum test utility)」)で
#   DBはABH配下catalog.dbへのP1 API注入・S3側はfake seam(空state)で観測。
#   実装前のため新条件のテストは実行failを許容(cargo test --no-runのcompileは通る)。
#   serve経由はP4(認証)までfail-closed維持(指摘#11)=server.protected-endpoints-fail-closedが
#   P3実装後の閉鎖維持も担保(id・文言不変のままtests/server_api.rsの追加testで強化)。
#   設計6章に応答の詳細形式が規定されない点は以下の解釈で条件化(実装はこれに従う):
#   - 一覧系の応答は resource 名のkeyでwrap({"entities":...}/{"pins":...}/
#     {"locations":...}/{"pending":...})。pageingは設計上page paramが存在する
#     GET /api/entitiesのみ(page=1始点・total_pages付き)
#   - scope絞り込みは query param scope=<bucket>:<prefix>(bucket名にコロン非含有
#     のため一意。省略時は実効profileのscope)
#   - 要素schemaは既存--format jsonと共通(entry_summary_json互換・list pins/versions
#     相当・diffはcmd_diffのJSON語彙)=設計6章「JSON schemaを--format jsonと共通化」
#   - GET /api/syncは未sync時もstatus="unknown"で200( staleness表示のため常に応答)
#   - GET /api/diffは未実行時404 not_found(保存済みの最終結果のみ200)
# 2026-11-05: TASK-9 Phase P4(passkey認証)対応でテスト先行の条件追加(3条件)。
#   excluded「passkey認証(webauthn-rs・challenge・session付替・login/logout API・
#   auth系endpoint)」を解消し、認証契約の詳細は新設webauthn.toml(認証area)へ条件化。
#   server.toml側はauth endpoint群のAPIとしての枠(auth-status応答形式・routing)と
#   保護API開放(未認証401への置換・認証済みでP3読取API応答)を担保する。
#   実装前のため新条件のテストは実行failを許容(cargo test --no-runのcompileは通る)。
#   GET /api/auth/statusの応答形式は設計6章に詳細が無いため解釈で確定:
#   {"authenticated": <bool>, "credentials": <数>}(未認証・未登録でも200=LoginViewの
#   UI誘導基盤)。
# 2026-11-05: TASK-9 Phase P5(pending catalog)対応でテスト先行の条件追加(2条件)。
#   excluded「pending・diffの実質の中身」のうちpending分(POST /api/pending/scan・scan・
#   未backup分類)を解消し条件化(diff UI分はP6としてexcludedへ残す)。実装前のため
#   新条件のテストは実行failを許容(cargo test --no-runのcompileは通る)。
#   設計6章にP5分の応答詳細が規定されない点は以下の解釈で条件化(実装はこれに従う):
#   - POST /api/pending/scanはrequest body無し(scan設定はpipeline.toml
#     [profiles.<n>.catalog.scan]=catalog.toml headerの判断・sha256再計算optionはCLIのみ)。
#     応答はscan実行後の最新一覧をGET /api/pendingと同一schema({"pending":[...]})で返す
#   - GET /api/pendingのstatus絞り込みはquery param ?status=<unbacked|changed|ok|unknown>
#     (単一値・省略時全件)。不正値は400 invalid_request(既存error体系と共通)
#   - POST /api/pending/scanは保護API(未認証401=auth_gate)。scanのDB書込はsyncと
#     同一のsingle-flight(semaphore 1)で直列化する(設計1章)
# 2026-11-05: TASK-9 Phase P6(diff UI)対応でexcluded「diff UI(P6: diff結果のfrontend
#   画面表示)」を解消(削除)。diff UIはfrontend area(frontend.toml)の
#   frontend.diff-client-and-store・frontend.diff-run-trigger・
#   frontend.diff-view-stateへ条件化。diff API(POST/GET /api/diff)自体はP3条件
#   (server.diff-endpoints)が担保済みのため本areaへの新規条件は無し。

