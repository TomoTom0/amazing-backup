[[condition]]
id = "server.api-key-auth-establishes-session"
target_function = "server::handler POST /api/auth/api-key"
source = "TASK-13設計(tmp/tasks/tm-13/design_api-key-auth.md) D13・2.3(POST /api/auth/api-key {api_key}で既存session(tower-sessions・24h cookie)へ合流。hitならpasskey login finishと同一手順=レビューM-1)・D14・4章"
description = "POST /api/auth/api-keyはapi_keyのSHA-256 hexでapi_keys table(永続class)を検索し、LAN内接続+登録済みkey一致ならpasskey login finishと同一手順でsessionを確立する(session.cycle_id()=session固定化対策→session.insert(\"authenticated\", true)→establish_session_id(&session, \"api_key\"))。応答はlogin finishと同一の{\"status\":\"ok\"}形式・Set-Cookieにsession cookie。確立したsession cookieで以降の保護API(auth_gate)を通過する(D13=api-keyはsession交換に単純化。api-key検索はrun_blocking経由=設計2.3) (unit, fake seam)"
given = "api_keys tableへkey挿入(rusqlite直接=insert_api_key APIと同一schema)済み・remote addr=127.0.0.1(LAN内)での POST /api/auth/api-key {\"api_key\": <key>} と、そのSet-CookieでのGET /api/entities"
expect_return_shape = "POSTは200+{\"status\":\"ok\"}+session cookie(Set-Cookie)。続くGET /api/entitiesは200(session認証で保護API通過)(実装前はroutingが無くfallbackの404でfailを許容)"
source_lines = "src/server.rs:4551"

