# amazing-backup テスト設計条件書(server エリア)
# 出典: tmp/tasks/tm-9/design_catalog-frontend-auth.md 1章(全体構成・D2)・6章(API設計)・
#   8章(server.toml)・9章(公開範囲・D4)・10章(build・配布)・12章 Phase P2(serve基盤)・
#   12章 Phase P3(読取API)。
#   D1〜D11は2026-11-05ユーザー承認済み。port割当はD5確定値(40510=本番serve・40511=stg・
#   40512=Vite dev server・40513-40514=予備。範囲はユーザー指定・割当はserver.toml/vite.config.ts管理)。
# 2026-11-04: TASK-9 Phase P2(serve基盤)対応でテスト先行の条件書(新設feature)。
#   src/server.rs は設計12章P2で新設されるmodule(axum serve・rust-embed静的配信)。
#   実装前のため新条件のテストは実行failを許容(serve subcommand未実装=exit 64で
#   起動失敗・HTTP応答なし。cargo test --no-runのcompileは通る)。
#   src/server.rs内のunit test(handler単位)はP3実装時に追加する方針。
#   既存config.tomlのconfig init系条件(id不変)へserver.toml生成分の文言改訂が必要になるが、
#   これはP2実装工程での追随とする(2026-10-29 TASK-1「実装工程の対応のため本更新では未触」と
#   同一運用。本条件書のserver.config-init-generates-server-tomlが追加生成分の本体を担保)。
# 2026-11-05: TASK-9 Phase P3(読取API)対応でテスト先行の条件追加(11条件)。
#   excluded「読取API endpoint群とerror体系」を解消し6章のendpoint一覧からP3対象
#   (読取系+軽操作)を条件化。テストはsrc/server.rs内#[cfg(test)]のhandler単体test
#   (router oneshot・設計11章「API handler(in-memory DB+axum test utility)」)で
#   DBはABH配下catalog.dbへのP1 API注入・S3側はfake seam(空state)で観測。
#   実装前のため新条件のテストは実行failを許容(cargo test --no-runのcompileは通る)。
#   serve経由はP4(認証)までfail-closed維持(指摘#11)=server.protected-endpoints-fail-closedが
#   P3実装後の閉鎖維持も担保(id・文言不変のままtests/server_api.rsの追加testで強化)。
#   設計6章に応答の詳細形式が規定されない点は以下の解釈で条件化(実装はこれに従う):
#   - 一覧系の応答は resource 名のkeyでwrap({"entities":...}/{"pins":...}/
#     {"locations":...}/{"pending":...})。pageingは設計上page paramが存在する
#     GET /api/entitiesのみ(page=1始点・total_pages付き)
#   - scope絞り込みは query param scope=<bucket>:<prefix>(bucket名にコロン非含有
#     のため一意。省略時は実効profileのscope)
#   - 要素schemaは既存--format jsonと共通(entry_summary_json互換・list pins/versions
#     相当・diffはcmd_diffのJSON語彙)=設計6章「JSON schemaを--format jsonと共通化」
#   - GET /api/syncは未sync時もstatus="unknown"で200( staleness表示のため常に応答)
#   - GET /api/diffは未実行時404 not_found(保存済みの最終結果のみ200)
# 2026-11-05: TASK-9 Phase P4(passkey認証)対応でテスト先行の条件追加(3条件)。
#   excluded「passkey認証(webauthn-rs・challenge・session付替・login/logout API・
#   auth系endpoint)」を解消し、認証契約の詳細は新設webauthn.toml(認証area)へ条件化。
#   server.toml側はauth endpoint群のAPIとしての枠(auth-status応答形式・routing)と
#   保護API開放(未認証401への置換・認証済みでP3読取API応答)を担保する。
#   実装前のため新条件のテストは実行failを許容(cargo test --no-runのcompileは通る)。
#   GET /api/auth/statusの応答形式は設計6章に詳細が無いため解釈で確定:
#   {"authenticated": <bool>, "credentials": <数>}(未認証・未登録でも200=LoginViewの
#   UI誘導基盤)。
# 2026-11-05: TASK-9 Phase P5(pending catalog)対応でテスト先行の条件追加(2条件)。
#   excluded「pending・diffの実質の中身」のうちpending分(POST /api/pending/scan・scan・
#   未backup分類)を解消し条件化(diff UI分はP6としてexcludedへ残す)。実装前のため
#   新条件のテストは実行failを許容(cargo test --no-runのcompileは通る)。
#   設計6章にP5分の応答詳細が規定されない点は以下の解釈で条件化(実装はこれに従う):
#   - POST /api/pending/scanはrequest body無し(scan設定はpipeline.toml
#     [profiles.<n>.catalog.scan]=catalog.toml headerの判断・sha256再計算optionはCLIのみ)。
#     応答はscan実行後の最新一覧をGET /api/pendingと同一schema({"pending":[...]})で返す
#   - GET /api/pendingのstatus絞り込みはquery param ?status=<unbacked|changed|ok|unknown>
#     (単一値・省略時全件)。不正値は400 invalid_request(既存error体系と共通)
#   - POST /api/pending/scanは保護API(未認証401=auth_gate)。scanのDB書込はsyncと
#     同一のsingle-flight(semaphore 1)で直列化する(設計1章)
# 2026-11-05: TASK-9 Phase P6(diff UI)対応でexcluded「diff UI(P6: diff結果のfrontend
#   画面表示)」を解消(削除)。diff UIはfrontend area(frontend.toml)の
#   frontend.diff-client-and-store・frontend.diff-run-trigger・
#   frontend.diff-view-stateへ条件化。diff API(POST/GET /api/diff)自体はP3条件
#   (server.diff-endpoints)が担保済みのため本areaへの新規条件は無し。
# 2026-11-05: TASK-13(serve認証へのapi-key認証追加・接続元LAN内限定)対応でテスト先行の
#   条件追加(5条件)・文言改訂(1条件=server.auth-endpoints-routingのapi-key endpoint
#   追加・id不変)。出典: tmp/tasks/tm-13/design_api-key-auth.md D12〜D14・2.3/2.4章・
#   4章(レビューH-1/M-1〜M-4/L-1〜L-2反映済み)。
#   テストはsrc/server.rs内#[cfg(test)]のhandler単体test(AuthFlow)で観測。remote addrは
#   AuthFlow::callへremote addr引数(既定=127.0.0.1相当のLAN内addr)を追加するseamで
#   挿入する(Request::builder().extension(axum::extract::ConnectInfo(addr))=本番の
#   into_make_service_with_connect_infoと同一のextensions機構。レビューH-1)。
#   api_keys tableへの行挿入はrusqlite直接(実装後のinsert_api_key APIと同一schema。
#   実装前はapi_keys table不在によりfail=赤を許容)。
#   設計に応答詳細が規定されない点は以下の解釈で条件化(実装はこれに従う):
#   - api-key認証成功の応答はlogin finishと同一の{"status":"ok"}形式
#   - 403のerror codeはforbidden_source(設計2.3のcode指定)
#   - api-key欄・専用失敗表示のfrontend分はfrontend.tomlへ条件化
# 2026-11-06: TASK-13コードレビュー指摘対応(低重要度)で条件追加(1条件)・実装追従。
#   - server.api-key-lan-boundary-table: is_lan_ipのLAN境界IP直接testの追加
#     (レビュー指摘: 境界IPの直接test不在。172.16/12・169.254/16・fc00::/7・fe80::/10
#     の内外境界とv4-mapped正規化)。
#   - src/server.rsのbootstrap token乱数読取を共通helper(storage::random_bytes)へ
#     切替(挙動不変)。src/server.rsが変わるためverified=falseへ戻す(全件verify後に
#     trueへ復帰)。
# 2026-11-14: TASK-17(Web UI全体設計)9章W1(TASK-18)対応でテスト先行の条件追加
#   (2条件)。出典: tmp/tasks/tm-17/design_webui-overall.md(2026-11-13ユーザー承認
#   済み) 3.2(GET /api/runs・GET /api/jobs)・2.1(ホームbackup概况・実行中job区画)・
#   6章(job系APIも同一auth_gate)・9章W1行。
#   - server.runs-list: versionsのbatch_id集約run一覧。応答schema
#     ({runs:[{batch_id,date,entity_count}]})・並び(date降順=直近run先頭)・
#     entity_count(=runのversion数=対象実体数)・date(=run内version日時の最新)は
#     設計3.2に詳細が規定されない点の解釈として条件本文へ確定(実装はこれに従う)。
#     scopeは読取API共通(server.read-api-uses-serve-profileと同一扱い)
#   - server.jobs-list: W1時点はjob機構(job発行・jobs table)がW4のため常に
#     200+{"jobs":[]}の空応答。status/kind絞り込みparamはW4で実質化。scope絞り
#     込みparamは設計3.2どおり持たない(実効1 scope)。保護API(未認証401)
#   実装前のため新条件のテスト(src/server.rs内handler単体test 2件)は実行failを
#   許容(routingが無くfallback 404由来。cargo test --no-runのcompileは通る)。
#   [meta]はテスト先行のためverified=falseへ(W1実装後に全件verifyでtrueへ復帰)。
# 2026-11-14: TASK-17 9章W2(TASK-19: tag/collection・3ビュー)対応でテスト先行の
#   条件追加(9条件)。出典: tmp/tasks/tm-17/design_webui-overall.md 3.2(entitiesの
#   tag/collection絞り込み・GET /api/tags,folders,collections・PUT tags・collections系
#   書込API)・4.1(tags/collections/collection_items/audit_log table)・4.3(folder=
#   location.labelの階層集約・tag/collectionはlocal語彙)・6章(書込APIも同一auth_gate)・
#   9章W2行・11章。
#   テストはsrc/server.rs内#[cfg(test)]のhandler単体test(api()/api_body()のrouter
#   oneshot。audit_log・対照scope行はABH配下catalog.dbへのrusqlite直接読書で観測)
#   とtests/server_api.rs(serve経由の未認証401回帰観測1件)で観測。
#   実装前のため新条件のテストは実行failを許容(routing不在のfallback 404・table
#   不在。cargo test --no-runのcompileは通る。未認証401観測のみauth_gate実装済みの
#   ため緑=W1のserver.jobs-listと同一位置づけ)。
#   設計に応答詳細が規定されない点は以下の解釈で条件化(実装はこれに従う):
#   - GET /api/tagsの応答は{"tags":[{tag,entity_count}]}・並びはtag名昇順・
#     entity_countは当該tagを持つ実効scope内entity数
#   - GET /api/foldersの応答は{"folders":[{label,path,entity_count}]}で各行=labelの
#     directory区切りの階層node(中間node含む)・path=nodeのrootからの完全path(既存
#     label=絞り込みの値と一致)・label=nodeの最終区切り要素・entity_count=当該node
#     配下のentity数(子folder配下を含む合計)・並びはpath昇順。label無し("")は対象外
#   - GET /api/collections一覧は{"collections":[{id,name,entity_count}]}(name昇順)・
#     詳細・作成・改名・items追加/除去の応答は詳細schema{"collection":{id,name,uuids}}
#     (uuidsは追加順)・DELETE collectionは{"status":"ok"}(読取系と同一schema=3.1方針)
#   - ?collection=<id>の値はcollections.id(改名に追従しないためnameでない)
#   - PUT /api/entities/:uuid/tags応答はGET /api/entities/:uuidと同一のEntityDetail
#     形式(uuid/title/locations/versions/latest_date/latest_size/pins/version_list+
#     tags+collections)=2026-11-14実装時の契約統一裁定(設計3.1「書込応答は読取系と
#     同一schema・操作後に再GET不要」による。旧解釈{tags:[...]}から改訂)
#   - GET /api/entities一覧の各summary行はtags: string[](昇順)を含む(設計2.2
#     「行の列: 現行7列+tag列」。frontend EntitySummaryのtags必須化と整合)
#   - GET /api/entities/:uuid詳細はcollections: string[](所属collection名一覧・
#     name昇順)を含む(設計2.2詳細の「所属collection」表示)
#   - POST /api/collectionsのnameは空文字を422(他の書込APIの入力規則と共通の最低限)
#   - items再追加(既に構成のuuid)は冪等に成功(追加済みskip=UNIQUE PK衝突の握り潰し
#     ではなく正規のskip扱い)
#   - audit_logのaction語彙: tags_replace / collection_create / collection_rename /
#     collection_delete / collection_items_add / collection_items_remove・outcomeは
#     "ok"|"failed"(失敗時はerror_code入り)・scopeはbucket:prefix形式・detail_jsonは
#     対象特定情報(uuid・collection id/name等)のJSON文字列
#   [meta]はテスト先行のためverified=falseへ(W2実装後に全件verifyでtrueへ復帰)。

