# 2026-11-24: TASK-17 9章W4(TASK-27: job機構+get)対応でテスト先行の条件追加
#   (7条件)・文言改訂(1条件=server.jobs-listのW4実質化。id不変)。出典:
#   tmp/tasks/tm-17/design_webui-overall.md 3.2(job系API: POST /api/jobs/get・
#   GET /api/jobs(/:id)・POST /api/jobs/:id/cancel)・4.1(jobs table)・5章(job機構:
#   直列worker・semaphore統合・waiting_restore定期確認・interrupted)・5.2(status
#   遷移とprogress)・5.4(再起動時interrupted)・6章(job系APIも同一auth_gate)・
#   9章W4行・11章(時刻注入seam)。
#   テストはsrc/server.rs内#[cfg(test)]のhandler・JobManager単体test(8件)と
#   tests/server_api.rs(serve経由の未認証401回帰観測1件)で観測。job実行の実体
#   検証(fake S3上の実object取得)はjob_exec_setup(実ssh鍵pair+実age)で行う
#   (ssh-keygen/age不在環境はskip=restore系結合testと同一扱い)。
#   設計に応答詳細が規定されない点は以下の解釈で条件化(実装はこれに従う):
#   - POST /api/jobs/get応答は{"job":<job object>}(wrap形式=collections詳細と
#     同一。3.1「書込応答は操作後の対象状態」=読取系と同一schema)。job objectは
#     {id,kind,status,params,progress,result,error,created_at,updated_at}。GET /api/jobs
#     の各要素・GET /api/jobs/:id・cancel応答も同一形式
#   - 必須field欠落・型違反は400 invalid_request・値域規則違反(tier/days/空uuid/
#     空out)は422 validation_failed(書込APIの既存区分と共通)
#   - job一覧の並び: 進行中(queued/running/waiting_restore)を先頭groupへ・各group内
#     はid降順(新しい順)。「降順」の設計3.2表現は発行順の新しい順(id=発行順)と解釈
#   - ?status=語彙はqueued/running/waiting_restore/succeeded/failed/interrupted/
#     cancelled・?kind=語彙はget/push(W5語彙込み。現在発行されるのはgetのみ)。
#     不正値は400 invalid_request(pendingのstatus絞り込みと共通)
#   - cancelの応答は操作後のjob object(取り消し済みstatus)。queued以外(実行中・
#     完了系)は409 duplicate(設計3.2「実行中は409」=409を担うcodeはduplicateのみ
#     のため)。取消後のstatus値は設計規定がないため"cancelled"とする(取消の記録=
#     再実行対象として一覧に残る・行は消さない)
#   - get job失敗時のerror_codeはBackupError→API codeの既定変換(api_error_from)に
#     従う(索引解決失敗=not_found・転送失敗=upstream等)
#   - progress_jsonは{phase,total,done,current_path}+waiting_restore中のみ
#     next_check_at(timerの次回確認時刻・UIは未知fieldを無視)。phase語彙は
#     queued→resolve→restore→fetch。getは対象1件のためtotal=1
#   - waiting_restore定期確認の間隔はJobManager側の値(既定15分=設計5.2)。
#     settings table(restore_check_interval_min)はW7範囲のため本条件では作らない
#   [meta]はテスト先行で始め・同一session内でW4実装後に全件verify(cargo test全binary
#   緑・vitest緑・verify-conditions PASS)を確認してverified=trueへ復帰した。
