# amazing-backup テスト設計条件書(server エリア)
# 出典: tmp/tasks/tm-9/design_catalog-frontend-auth.md 1章(全体構成・D2)・6章(API設計)・
#   8章(server.toml)・9章(公開範囲・D4)・10章(build・配布)・12章 Phase P2(serve基盤)。
#   D1〜D11は2026-11-05ユーザー承認済み。port割当はD5確定値(40510=本番serve・40511=stg・
#   40512=Vite dev server・40513-40514=予備。範囲はユーザー指定・割当はserver.toml/vite.config.ts管理)。
# 2026-11-04: TASK-9 Phase P2(serve基盤)対応でテスト先行の条件書(新設feature)。
#   src/server.rs は設計12章P2で新設されるmodule(axum serve・rust-embed静的配信)。
#   実装前のため新条件のテストは実行failを許容(serve subcommand未実装=exit 64で
#   起動失敗・HTTP応答なし。cargo test --no-runのcompileは通る)。
#   src/server.rs内のunit test(handler単位)はP3実装時に追加する方針。
#   P3(読取API)・P4(認証)・frontend(frontend.toml)の条件は後続waveで書く(本ファイル対象外)。
#   既存config.tomlのconfig init系条件(id不変)へserver.toml生成分の文言改訂が必要になるが、
#   これはP2実装工程での追随とする(2026-10-29 TASK-1「実装工程の対応のため本更新では未触」と
#   同一運用。本条件書のserver.config-init-generates-server-tomlが追加生成分の本体を担保)。

[meta]
feature = "server"
source_file = "src/server.rs"
verified = true
verified_at = "2026-11-05"
verified_by = "claude"
test_command = "cargo test"
source_hash = "77964e0b90eb38d95f09ea2e632ca197f039f376"
note = "TASK-9設計1章(serve subcommand・async実行境界)・6章(API)・8章(server.toml)・9章(D4 localhost既定)・10章(dist二階建て)・12章P2の条件化。テストはbin subprocess(spawn)・素朴HTTP client・SIGTERMで観測しsrc/server.rs直接参照のunit testは実装時に追加"

[[condition]]
id = "server.serve-subcommand-health"
target_function = "serve subcommand / GET /api/health"
source = "tmp/tasks/tm-9/design_catalog-frontend-auth.md 1章(D2同一binaryのserve subcommand)・6章(endpoint一覧: GET /api/healthは認証不要liveness)・12章P2"
description = "同一binaryのserve subcommandがHTTP serverを起動する(APIのmount prefixは/api/)。GET /api/healthは認証不要のliveness応答(HTTP 200)を返す (integration, fake seam)"
given = "server.toml(port=空きport)を配置したAMAZING_BACKUP_HOMEとfake S3 stateでserveを起動しlistenを待ち合わせた後のGET /api/health"
expect_return_shape = "HTTP status 200の応答があり、serveは起動を継続する(実装前はserve subcommandが未知=exit 64で起動しない)"
source_lines = "tests/server_api.rs:32"

[[condition]]
id = "server.server-toml-listen-config"
target_function = "server::load_server_config([server])"
source = "tmp/tasks/tm-9/design_catalog-frontend-auth.md 8章(server.toml: listen_addr既定127.0.0.1/port/rp_id既定localhost/rp_origin既定http://localhost:<port>・backup profileとは分離=指摘#13)・9章(D4: v1はlocalhost既定)・D5(port確定値)"
description = "server.toml([server] listen_addr・port・rp_id・rp_origin)はserver共通設定のみを持ちbackup profile(pipeline/aws)とは分離する。listen_addr/portはserveのlistenへ反映する(listen_addr既定127.0.0.1・port既定40510=D5本番serve。rp_id既定\"localhost\"・rp_origin既定\"http://localhost:<port>\"はP4のWebAuthnで使用=本条件の観測対象外) (integration, fake seam)"
given = "port(空きport)を明示したserver.tomlでのserve起動と、[server]からport keyを省略したserver.tomlでのserve起動"
expect_return_shape = "明示時は当該portでHTTP応答し、port省略時は40510で応答する(listenは127.0.0.1)"
source_lines = "src/server.rs:364; src/server.rs:394; src/server.rs:404; tests/server_api.rs:48"

[[condition]]
id = "server.config-init-generates-server-toml"
target_function = "config::cmd_config_init(server.toml生成)"
source = "tmp/tasks/tm-9/design_catalog-frontend-auth.md 8章(config: repo配布はconfigs/server.example.toml+binary埋め込みtemplate・config initが生成)・12章P2(server.toml+config init更新)"
description = "config initはserver.tomlも生成する(configs/server.example.toml基準の埋め込みtemplate。listen_addr=127.0.0.1・port=40510の既定構成。server共通設定のみでbackup profileを含まない) (integration)"
given = "空のconfig dir(AMAZING_BACKUP_HOME)でのconfig init実行"
expect_return_shape = "$ABH/server.tomlが生成され[server]にlisten_addr = \"127.0.0.1\"とport = 40510を含む。既存3file(pipeline.toml・aws.toml・credential雛形)の生成は従来どおり"
source_lines = "tests/server_api.rs:82"

[[condition]]
id = "server.dist-missing-api-only-with-warning"
target_function = "serve(rust-embed allow_missing・dist欠落検出)"
source = "tmp/tasks/tm-9/design_catalog-frontend-auth.md 10章(指摘#10 dist供給の二階建て: 欠落時もbuild・install可能・serveは静的配信なしで起動+warning+frontend build手順表示)・12章P2"
description = "frontend distの埋め込み欠落時もbinaryはbuild・install可能(rust-embedのallow_missing)で、serveはdist欠落を検出したら静的配信なし(APIのみ)で起動し、warning+frontend build手順を表示する (integration, fake seam)"
given = "distが存在しない環境(repoからのbuild相当=CI/test環境の既定)でのserve起動"
expect_return_shape = "serveは起動しhealthが応答し、stderrにdist欠落のwarning(frontend build手順の案内)が表示される"
source_lines = "tests/server_api.rs:109"

[[condition]]
id = "server.protected-endpoints-fail-closed"
target_function = "serve router(保護endpointの未認証拒否)"
source = "tmp/tasks/tm-9/design_catalog-frontend-auth.md 12章P2(verify可能状態: 保護APIはfail-closed=未認証で全保護endpoint 503/401)・指摘#11(P3の機密APIはP4までfail-closed・tag releaseは保護API閉鎖状態のみ許可)"
description = "保護API(health・auth系以外)は未認証では応答内容を返さないfail-closed: 未認証は401(unauthenticated)、認証機構未構成の段階(P2〜P3)は503(configuration)で応答する(P4の認証実装まで保護APIは閉鎖) (integration, fake seam)"
given = "serve起動状態でのGET /api/entities(未認証・cookie無し)"
expect_return_shape = "HTTP statusは401または503で、保護対象のデータ(entity一覧)は応答bodyに含まれない"
source_lines = "tests/server_api.rs:129"

[[condition]]
id = "server.graceful-shutdown"
target_function = "serve(shutdown)"
source = "tmp/tasks/tm-9/design_catalog-frontend-auth.md 1章(実行境界: shutdownはgraceful=signal→進行中spawn_blocking完了待ち→close)"
description = "serveのshutdownはgraceful: SIGTERM/SIGINT受信時に進行中のspawn_blocking処理の完了を待ってから接続を閉じ、正常終了(exit 0)する (integration, fake seam)"
given = "serve起動・health応答確認後のSIGTERM送信とprocessの終了待ち"
expect_return_shape = "processはexit code 0で終了する(応答不能な即時停止・異常終了でない)"
source_lines = "tests/server_api.rs:155"

[[condition]]
id = "server.startup-sync-blocking-boundary"
target_function = "serve(起動時syncのasync実行境界)"
source = "tmp/tasks/tm-9/design_catalog-frontend-auth.md 1章(実行境界: S3/DB/scan等の重い処理はspawn_blocking経由・DB接続はspawn_blocking側でopen/per-call・Runtime::block_on panic回避)・4章(serve起動時にHEAD validator検証→変化あればGET+復号+DB反映)・11章(async handler→同期層の統合testでpanic検出)"
description = "serve起動時のHEAD validator検証+DB反映(P1同期層)はspawn_blocking経由で実行され、async context内からの同期層呼び出しによるRuntime混在panicを起こさない(DB接続はspawn_blocking側でopen/per-call) (integration, fake seam)"
given = "fake S3に索引objectを置いた状態(storage fixtureでbackup push済み)でserver.tomlを配置してserve起動"
expect_return_shape = "起動がpanicせずに完了しhealthが応答する(起動時syncの実行を通してもprocessが生存する)"
source_lines = "tests/server_api.rs:169"

