expect_return_shape = "実効scopeは200でruns配列2要素(先頭=run-2: batch_id/date/entity_count=2・2番目=run-1: entity_count=1=date降順)。run-3(対照scope)は含まれない。scope明示はrun-3のみ1要素。同日の2runはversion_tsが新しいrun(20261106-aaaaaa10)が先頭(batch_id降順だと誤ってzzzzzz99が先頭になる)。応答要素はbatch_id/date/entity_countのみ(version_tsを含まない)"
