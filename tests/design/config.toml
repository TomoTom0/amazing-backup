[[condition]]
id = "config.aws-credentials-file-required"
target_function = "config::load_aws"
source = "TASK-9 SDK移行設計 3.3・9.2(tmp/tasks/tm-9/design_sdk_migration.md 3章・9章)。10.2新規条件"
description = "aws.tomlの[aws].credentials_fileキー(credentialファイルpath)は必須キー。path解決は既存の--aws-config既定path等と同じcwd基準の相対path。キー欠落・空値は設定エラー2(明示的に与えたAPI keyという要件に合致し、書き漏れを即検出) (integration, fake seam)"
