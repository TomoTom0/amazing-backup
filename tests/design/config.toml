source_lines = "src/config.rs:615; tests/s3_backend.rs:163"

[[condition]]
id = "config.credentials-file-schema"
target_function = "config::load_credentials"
source = "TASK-9 SDK移行設計 3.1・3.2(tmp/tasks/tm-9/design_sdk_migration.md 3章)。10.2新規条件"
description = "credentialファイルschema: [credentials]テーブル配下はaccess_key_id/secret_access_key必須・session_token省略可(一時credential用)・deny_unknown_fields(未知キー拒否)。TOML parse失敗・[credentials]テーブル不在・必須キー欠落・空値・前後空白付き値は設定エラー2。session_token省略時も正常動作する (integration, fake seam)"
given = "正しい形式(session_token省略)のcredentialファイルと、不正TOML・未知キー・access_key_id欠落・空値・前後空白付き値の各credentialファイルでupload実行"
expect_return_shape = "正しい形式はexit 0(S3 API呼び出しまで到達)。不正系はいずれも exit 2(設定エラー)"
source_lines = "src/config.rs:707; tests/s3_backend.rs:184"

[[condition]]
id = "config.credentials-fail-closed"
target_function = "config::require_ready / config::load_credentials"
source = "TASK-9 SDK移行設計 3.5(tmp/tasks/tm-9/design_sdk_migration.md 3章)。10.2新規条件"
description = "fail-closed: credentials_fileが指すcredentialファイル不在・読込不能は設定エラー2で、credential chain(IMDS/env/~/.aws)へのfallbackは一切行わない(誤って別環境のcredentialで意図しないAWS accountへ接続する事故を構造的に防止) (integration, fake seam)"
given = "credentials_fileに不在pathを指定したaws.tomlでupload実行"
expect_return_shape = "exit 2(設定エラー)。fallbackせず失敗し、S3 API呼び出しは行われない"
source_lines = "src/config.rs:754; src/s3.rs:821; tests/s3_backend.rs:220"

[[condition]]
id = "config.credentials-value-not-leaked"
target_function = "config::load_credentials / s3::RealS3(error表示)"
source = "TASK-9 SDK移行設計 3.6・12.4(tmp/tasks/tm-9/design_sdk_migration.md 3章・12章)。10.2新規条件"
description = "credential値の非露出: 設定エラー時のerror文はcredentialファイルのpathのみを表示し、access_key_id/secret_access_key/session_tokenの値を含まない。正常時・転送エラー時の出力にも値は現れない(SDK呼び出し結果はmap_sdk_errorでBackupError化しunwrap/expect禁止によりpanic経路でもSdkError Debug展開しない) (integration, fake seam)"
given = "credential値へ一意の検出用文字列を埋め込んだcredentialファイルで、設定エラー(schema違反)となる実行と、fake seamで正常完了する実行・失敗注入(FAKE_S3_FAIL_CP_FOR)で転送エラーとなる実行"
expect_return_shape = "いずれの実行のstdout/stderrにも検出用文字列(credential値)が現れない"
source_lines = "tests/s3_backend.rs:238"

