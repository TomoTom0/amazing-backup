[meta]
feature = "config"
source_file = "src/config.rs"
verified = true
verified_at = "2026-11-03"
verified_by = "claude"
test_command = "cargo test"
source_hash = "8914616e3252d69b483f10ed2a20dbc97a77d99d"
note = "CONF-005(from-list)は targets::parse_from_list が実体。source_fileはエリアの主対象(src/config.rs)を指し、実関数はtarget_functionで特定する。TASK-9でload_credentials(src/config.rs新設)が追加され、credential系条件(CONF-009〜012)もsrc/config.rsが実体。TASK-1のconfig init実装(cmd_config_init系)もsrc/config.rsが実体。2026-11-02 TASK-7(pipeline profile化)のテスト先行更新でverified=falseへ戻した(実装後に全件pass確認のうえ記録)。2026-11-03 TASK-7実装完了(pipeline profile化: [profiles.<name>]schema・検証2層・旧形式移行error・load_pipeline必須profile引数・aws profile名規則・同一bucket警告・init同名対応案内)を反映しcargo test全件pass・verify-conditions.py PASSを確認してverified=trueへ復帰・source_hashを更新。2026-11-03 TASK-8 PR準備での実運用file形式退行検出を機にrepo-pipeline-file-profile-schemaを追加しcargo test全件pass(297件)・verify-conditions.py PASS(235条件)を確認・source_hashを更新"

[[condition]]
id = "config.xdg-default-paths"
target_function = "config::resolve_app_paths"
source = "TASK-19 body(XDG配置への移行・設計確定2026-10-23)"
description = "規定path解決(XDG準拠・env未指定時の既定): 設定dirは$XDG_CONFIG_HOME/amazing-backup/(未設定なら~/.config/amazing-backup/)配下のpipeline.toml・aws.toml。registryは$XDG_STATE_HOME/amazing-backup/registry.jsonl(未設定なら~/.local/state/amazing-backup/registry.jsonl。dirが無ければregistry書込時に作成)。暗号化一時物dirは$XDG_CACHE_HOME/amazing-backup/(未設定なら~/.cache/amazing-backup/)。XDG_*_HOMEは絶対pathのみ有効(空値・相対pathは未指定扱い=XDG base directory仕様準拠) (unit)"
given = "XDG_CONFIG_HOME/XDG_STATE_HOME/XDG_CACHE_HOMEに絶対pathを設定した環境と、未設定・空値・相対pathの各環境での規定path解決"
expect_return_shape = "絶対path設定時は$XDG_*_HOME配下のamazing-backup/...へ解決され、未設定・空値・相対path時は~/.config等のhome配下の既定へ解決される"
source_lines = "src/config.rs:1408"

