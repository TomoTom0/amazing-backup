expect_return_shape = "正常系は生成aws.tomlのparse後credentials_fileが当該pathと完全一致(escape崩れなし・コメント行は保持)しpipeline.tomlはtemplateとbyte一致。非UTF-8は設定エラー(exit 2)。劣化templateは内部エラー(exit 1)で生成しない"
