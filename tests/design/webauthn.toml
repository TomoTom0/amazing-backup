note = "TASK-9設計8章(passkey認証契約)・6章(auth endpoint群)・12章P4の条件化(P4テスト先行)。bootstrap token・challengeはin-memory、credential保存はcatalog.db credentials table(永続class)。未認証保護API 401・認証済みでの読取API応答はserver.protected-api-open-with-authと連動"

