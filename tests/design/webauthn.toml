# amazing-backup テスト設計条件書(webauthn エリア)
# 出典: tmp/tasks/tm-9/design_catalog-frontend-auth.md 8章(passkey認証: D3/D9・bootstrap
#   token契約=指摘#8・challenge・session・credential保存=永続class)・6章(auth endpoint群)・
#   2章(秘密情報境界: bootstrap tokenをAPI応答へ出さない)・11章(server-to-server自動検証=
#   指摘#12)・12章Phase P4(passkey認証)・「実装時検証事項」2(webauthn-rs 0.6系のtest支援=
#   virtual authenticator有無)。D1〜D11は2026-11-05ユーザー承認済み。
# 2026-11-05: TASK-9 Phase P4(passkey認証)waveでテスト先行により新設。server.toml側
#   excluded「passkey認証(webauthn-rs・challenge・session付替・login/logout API・auth系
#   endpoint)」を解消し、認証契約を本areaへ条件化する。実装前のため新条件のテストは
#   実行failを許容(cargo test --no-runのcompileは通る・既存342testは緑維持)。
#   実装時検証事項2の調査結果(2026-11-05・crates.io/docs.rs): webauthn-rs 0.6.2が
#   stable最新であり、virtual authenticator/soft passkey系のtest支援moduleは存在しない
#   (fake moduleはCredentialID生成の偽装=account enumeration対策用で、合成認証応答の
#   生成ではない)。よってserver-to-server検証はWebAuthn仕様準拠の合成認証応答(soft
#   passkey)方式とする(test helperはP4実装時にwebauthn-rs 0.6系の応答型・base64url
#   符号化へ接続する)。
#   設計8章にrequest/responseの詳細形式が規定されない点は以下の解釈で条件化(実装は
#   これに従う):
#   - POST /api/auth/register/startのrequest bodyは {"token": "<bootstrap token>"}。
#     応答はWebAuthn登録options(PublicKeyCredentialCreationOptions相当のJSON=challenge
#     含有)+anonymous session cookie(Set-Cookie)。tokenの検証はstart時点で行う
#   - POST /api/auth/register/finishのrequest bodyはRegisterPublicKeyCredential相当の
#     JSON(id/rawId/response.attestationObject/clientDataJSON・base64url符号化)
#   - POST /api/auth/login/startの応答はPublicKeyCredentialRequestOptions相当のJSON
#     (challenge・allowCredentials)+anonymous session cookie
#   - POST /api/auth/login/finishのrequest bodyはPublicKeyCredential相当のJSON
#     (id/rawId/response.authenticatorData/clientDataJSON/signature)
#   - POST /api/auth/logoutは要認証(未認証は401)・成功で200+session破棄
#   - tokenの不正(不一致・期限切れ・消費済み)はすべて401 unauthenticated(登録閉鎖=
#     fail-closed。503や403ではなく認証情報不正の区分)
#   期限系契約(token 10分・challenge 120秒・session 24h)の自動観測のため、P4実装は
#   時刻注入seam(testから現在時刻を差し替え可能な経路)を提供する(testability要求。
# 2026-11-05: TASK-9 Phase P6対応でexcluded「manage auth remove(CLI)によるcredential
#   失効」を解消(削除)。CLI管理コマンド面は本areaのexcluded理由どおりcli area
#   (cli.toml)へ条件化(cli.manage-auth-list-and-remove・
#   cli.manage-auth-remove-all-guides-rebootstrap)。認証契約(register/login/
#   logout)の条件は本areaのまま不変。

