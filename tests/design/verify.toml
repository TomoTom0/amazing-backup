[[condition]]
id = "verify.roundtrip-env-error-exit-2"
target_function = "backup verify --roundtrip"
source = "tmp/tasks/tm-1/design_backup_pipeline.md 8章 VER-011(2026-10-08レビュー指摘6対応。2.4・7.1)。TASK-11(Phase B): 旧verify削除によりbackup verify経路へ文言改訂"
description = "backup verify --roundtrip はroundtrip開始前に秘密鍵ファイルの存在とageバイナリを事前検査し、不在なら設定・環境エラー2で即終了する(対象ファイルごとの復号失敗に紛れて検証エラー4とならない) (unit)"
given = "秘密鍵ファイルが不在の状態、およびageバイナリがPATH上に無い状態での backup verify --roundtrip 実行"
expect_return = "exit code 2(設定・環境エラー)"
source_lines = "src/cli.rs:1032"

[[condition]]
id = "verify.decrypt-error-includes-age-stderr"
target_function = "crypto::decrypt_sha256 / crypto::decrypt_impl"
source = "tmp/tasks/tm-1/design_backup_pipeline.md 8章 VER-012(2026-10-08レビュー指摘7対応。6章)"
description = "復号のstdin投入threadエラー時のエラーメッセージにage stderrの内容を含める(encrypt側の「{e}; age stderr: {stderr_text}」形式と対称) (integration)"
given = "age -d が異常終了する復号(誤鍵指定等)でstdin投入threadがEPIPE等のエラーを受け取るケース"
expect_return_shape = "ProcessErrorのmessageに起因エラーと age stderr: <内容> が両方含まれる"
source_lines = "tests/verify_roundtrip.rs:135"

[[condition]]
id = "verify.structure-recipients-bijection"
target_function = "backup verify(構造検査・recipient照合)"
source = "tmp/tasks/tm-1/design_backup_pipeline.md 8章 VER-013(2.4-1・4.4。2026-10-11 TASK-2で追加)。TASK-11(Phase B): 旧verify削除によりbackup verify経路へ文言改訂"
description = "構造検査(既定段階)は各暗号化記録のage_pathの.age(manifestの.ageは含まない)のヘッダをparseし、ssh-ed25519 stanza識別子がregistry記録recipients指紋から導出したv1.2形式指紋prefix集合(記録指紋SHA256:<b64>のb64部をdecodeした32byteの先頭4byteをb64(paddingなし)符号化)と全単射で対応することを照合する。誤recipient鍵で作られた.age・stanza数不一致・識別子が指紋prefix形式(decode結果4byte)でない場合・記録指紋からprefixを導出できない場合(b64 decode不能・decode結果が32byte未満)・旧形式tagのみでv1.2形式stanzaを1つも持たない.ageは、いずれも検証エラー4(fail-closed。照合skipではなく) (unit)"
given = "合成ageヘッダ(v1.2形式ssh-ed25519 stanza+`--- `終端)の.ageとrecipients記録をSHA256:<b64(32byte)>実形式の指紋で構成した、(a)正recipient(全単射一致)・(b)誤recipient指紋(stanzaは鍵Aのprefix・記録は鍵Bの指紋)・(c)stanza数不一致(ヘッダ2 stanza vs 記録1指紋)の3caseでの backup verify 実行"
expect_return = "(a)はexit code 0、(b)(c)はexit code 4(recipient照合不一致の該当record特定表示)"
source_lines = "src/cli.rs:867; tests/verify_roundtrip.rs:157"

[[condition]]
id = "verify.swept-run-artifacts-excluded"
target_function = "backup verify(掃除済みrunの検査対象外判定)"
source = "TASK-11(Phase B)コードレビュー指摘M-1+tmp/tasks/tm-10/design_s3_storage.md 4.1([output].keep_artifacts=run掃除)・2.2(run末尾の索引更新)"
description = "backup verifyはkeep_artifacts=\"run\"の既定動作で成功run直後にdata/out/<batch_id>/を掃除されたrun(file_write記録のage_path実ファイル・run manifest実ファイルが不在)を検証失敗扱いにしない: 当該batchのindex_upload成功記録(成功run末尾の索引更新が完了した事実)があり・run成果物dirが不在のbatchは「掃除済み・検査対象外」として構造検査(.age不在・manifest不在)・--checksum・--roundtripの対象から除外し、掃除済みrun件数を報告する。run成果物が残っているbatch(keep_artifacts=\"always\"・失敗run残り・掃除済み判定を満たさないbatch)は従来どおり検査対象(実ファイル欠損は検証エラー4のまま) (integration, fake seam)"
given = "keep_artifacts=\"run\"既定でbackup push成功後(当該batchのrun成果物dirが掃除済み)の backup verify・backup verify --checksum・backup verify --roundtrip の各実行"
expect_return_shape = "いずれも exit 0(掃除済みrunは検査対象外の報告表示あり)。.age・manifestの不在は検証エラー4として報告されない"
source_lines = "tests/storage_backup.rs:711"
