[[condition]]
id = "verify.unknown-record-type-skipped"
target_function = "registry::load_registry"
source = "tmp/tasks/tm-1/design_backup_pipeline.md 8章 VER-009(規則は4.1注記)"
description = "registry内の未知record_type行(既知3種 encrypt/upload/manifest_upload 以外)は警告のうえ無視され読込が継続する(既知3種のみreduce・将来のschema追加への前方互換) (unit)"
given = "未知record_typeの行を既知レコードに混在させたregistry"
expect_return_shape = "未知record_typeの行は警告表示のうえ結果から除外され、残り行の読込・reduceは継続する(読込エラーとならない)"
source_lines = "src/registry.rs:535"

[[condition]]
id = "verify.registry-read-error-propagates"
target_function = "registry::load_registry"
source = "tmp/tasks/tm-1/design_backup_pipeline.md 8章 VER-010(2026-10-08レビュー指摘5対応。4.1)"
description = "registry読込のread errorは ErrorKind::NotFound のみ「空」として扱い、他のread error(directory指定によるEISDIR・権限不足等)はProcessエラーとして伝播する(初回実行以外の読込失敗を黙って空扱いにしない) (unit)"
given = "registry pathに実fileでないpath(directory)を指定した読込"
expect_throw = "ProcessError(exit code 4)。ファイル不在(NotFound)のみ空配列を返す"
source_lines = "src/registry.rs:481"

[[condition]]
id = "verify.roundtrip-env-error-exit-2"
target_function = "cli::cmd_verify --roundtrip"
source = "tmp/tasks/tm-1/design_backup_pipeline.md 8章 VER-011(2026-10-08レビュー指摘6対応。2.4・7.1)"
description = "verify --roundtrip はroundtrip開始前に秘密鍵ファイルの存在とageバイナリを事前検査し、不在なら設定・環境エラー2で即終了する(対象ファイルごとの復号失敗に紛れて検証エラー4とならない) (unit)"
given = "秘密鍵ファイルが不在の状態、およびageバイナリがPATH上に無い状態での verify --roundtrip 実行"
expect_return = "exit code 2(設定・環境エラー)"
source_lines = "src/cli.rs:1584"

[[condition]]
id = "verify.decrypt-error-includes-age-stderr"
target_function = "crypto::decrypt_sha256 / crypto::decrypt_impl"
source = "tmp/tasks/tm-1/design_backup_pipeline.md 8章 VER-012(2026-10-08レビュー指摘7対応。6章)"
description = "復号のstdin投入threadエラー時のエラーメッセージにage stderrの内容を含める(encrypt側の「{e}; age stderr: {stderr_text}」形式と対称) (integration)"
given = "age -d が異常終了する復号(誤鍵指定等)でstdin投入threadがEPIPE等のエラーを受け取るケース"
expect_return_shape = "ProcessErrorのmessageに起因エラーと age stderr: <内容> が両方含まれる"
source_lines = "tests/verify_roundtrip.rs:138"

[[condition]]
id = "verify.structure-recipients-bijection"
target_function = "cli::cmd_verify"
source = "tmp/tasks/tm-1/design_backup_pipeline.md 8章 VER-013(2.4-1・4.4。2026-10-11 TASK-2で追加)"
description = "構造検査(既定段階)は各encrypt記録のage_pathの.age(manifestの.ageは含まない)のヘッダをparseし、ssh-ed25519 stanza識別子がregistry記録recipients指紋から導出したv1.2形式指紋prefix集合(記録指紋SHA256:<b64>のb64部をdecodeした32byteの先頭4byteをb64(paddingなし)符号化)と全単射で対応することを照合する。誤recipient鍵で作られた.age・stanza数不一致・識別子が指紋prefix形式(decode結果4byte)でない場合・記録指紋からprefixを導出できない場合(b64 decode不能・decode結果が32byte未満)・旧形式tagのみでv1.2形式stanzaを1つも持たない.ageは、いずれも検証エラー4(fail-closed。照合skipではなく) (unit)"
given = "合成ageヘッダ(v1.2形式ssh-ed25519 stanza+`--- `終端)の.ageとrecipients記録をSHA256:<b64(32byte)>実形式の指紋で構成した、(a)正recipient(全単射一致)・(b)誤recipient指紋(stanzaは鍵Aのprefix・記録は鍵Bの指紋)・(c)stanza数不一致(ヘッダ2 stanza vs 記録1指紋)の3case"
expect_return = "(a)はexit code 0、(b)(c)はexit code 4(recipient照合不一致の該当record特定表示)"
source_lines = "src/cli.rs:1292; tests/verify_roundtrip.rs:180"
