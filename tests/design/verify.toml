[meta]
feature = "verify"
source_file = "src/cli.rs"
verified = true
verified_at = "2026-10-11"
verified_by = "claude"
test_command = "cargo test"
source_hash = "536a778d8e5633c7bdf24194829fe1451ff41414"
note = "verifyサブコマンドの統括は cli::cmd_verify、registry読込は registry::load_registry。source_fileはエリアの主対象(src/cli.rs)を指し、実関数はtarget_functionで特定する"

[[condition]]
id = "verify.structure-check-ok"
target_function = "cli::cmd_verify"
source = "tmp/tasks/tm-1/design_backup_pipeline.md 8章 VER-001(検査仕様は2.4-1)"
description = "整合している状態で構造検査(既定段階)が全項目ok・exit 0となる (unit)"
given = "正常なencrypt済registry・.age・manifestが揃った状態で verify 実行"
expect_return = "exit code 0(全検査項目ok表示)"
source_lines = "src/cli.rs:1225"

[[condition]]
id = "verify.missing-or-size-mismatch-error"
target_function = "cli::cmd_verify"
source = "tmp/tasks/tm-1/design_backup_pipeline.md 8章 VER-002(2.4-1・7.1のexit 4統一。2026-10-11 TASK-2で2.4-1の完全一致文言を反映)"
description = "構造検査で .age 欠損・age_sizeと実sizeの不一致を検出し、検証エラー4(欠損も不一致と同じく4に統一)。age_sizeは実ファイルsizeと完全一致を要求し、実sizeが記録値未満(切り詰め)・超過(追記)のいずれも不一致としてexit 4となる(記録値未満を警告継続にしない) (unit)"
given = ".age を削除したcaseと、age_size と異なる実sizeの .age のcase(実sizeが記録値を超過するcaseと未満に切り詰めるcaseの両方)"
expect_return = "exit code 4(該当recordのsource_pathと期待/実測の詳細表示)"
source_lines = "src/cli.rs:1241"

[[condition]]
id = "verify.torn-write-and-bad-json-lines"
target_function = "registry::load_registry"
source = "tmp/tasks/tm-1/design_backup_pipeline.md 8章 VER-003(規則は4.1注記)"
description = "registryの不正JSON行を検出。改行終端でない最終行はtorn writeとして警告のうえ除外され処理継続する (unit)"
given = "不正JSON行を含むregistryと、改行終端しない最終行(torn write)を含むregistry"
expect_return_shape = "不正JSON行は行番号付きでProcessError、torn write最終行は警告のうえ除外され残り行の読込が継続する"
source_lines = "src/registry.rs:507"

[[condition]]
id = "verify.checksum-detects-mutation"
target_function = "cli::cmd_verify --checksum"
source = "tmp/tasks/tm-1/design_backup_pipeline.md 8章 VER-004(2.4-2)"
description = "--checksum で .age の改変(byte追加)をsha256再計算により検出する (unit)"
given = ".age へ1byte追加した状態で --checksum 実行"
expect_return = "exit code 4(期待age_sha256と実測の不一致表示)"
source_lines = "src/cli.rs:1355"

[[condition]]
id = "verify.roundtrip-sha256-match"
target_function = "crypto::decrypt_sha256 / cli::cmd_verify --roundtrip"
