[[condition]]
id = "verify.roundtrip-wrong-key-error"
target_function = "crypto::decrypt_sha256"
source = "tmp/tasks/tm-1/design_backup_pipeline.md 8章 VER-006(2.4・7.1)"
description = "--roundtrip で鍵不一致(誤鍵)は処理エラー4となる (integration)"
given = "暗号化recipientと対にならない秘密鍵で --roundtrip 実行"
expect_return = "exit code 4(処理エラー)"
source_lines = "tests/verify_roundtrip.rs:52"

[[condition]]
id = "verify.roundtrip-manifest-crosscheck"
target_function = "cli::cmd_verify --roundtrip"
source = "tmp/tasks/tm-1/design_backup_pipeline.md 8章 VER-007(2.4-3)"
description = "--roundtrip でmanifest復号→registry突合(バッチ内ファイル数・各source_sha256・age_sha256)を行い、不一致を検出する (integration)"
