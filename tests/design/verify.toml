[[condition]]
id = "verify.runs-without-aws"
target_function = "cli::cmd_verify"
source = "tmp/tasks/tm-1/design_backup_pipeline.md 8章 VER-008(2.4)"
description = "verify は aws CLI不在・aws.toml不在でも完結する (unit)"
given = "aws CLI不在・aws.toml不在の環境で verify 実行"
expect_return = "exit code 0"
