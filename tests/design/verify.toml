[meta]
feature = "verify"
source_file = "src/storage.rs"
verified = false
verified_at = "2026-10-11"
verified_by = "claude"
test_command = "cargo test"
source_hash = "536a778d8e5633c7bdf24194829fe1451ff41414"
note = "ローカル整合検査(構造検査・--checksum・--roundtrip)の条件群。TASK-11(Phase B)で旧verifyサブコマンド(src/cli.rs cmd_verify)が削除され、backup verify(設計3.2・8.5維持点)へ集約。registry読込は registry::load_registry"

[[condition]]
id = "verify.structure-check-ok"
target_function = "backup verify(構造検査・Phase B新配置)"
source = "tmp/tasks/tm-1/design_backup_pipeline.md 8章 VER-001(検査仕様は2.4-1)。TASK-11(Phase B): 旧verify削除によりbackup verify経路へ文言改訂"
description = "整合している状態で構造検査(既定段階)が全項目ok・exit 0となる (unit)"
given = "正常なbackup push済registry・.age・manifestが揃った状態で backup verify 実行"
expect_return = "exit code 0(全検査項目ok表示)"
source_lines = "src/cli.rs:802"

[[condition]]
id = "verify.missing-or-size-mismatch-error"
target_function = "backup verify(構造検査・Phase B新配置)"
source = "tmp/tasks/tm-1/design_backup_pipeline.md 8章 VER-002(2.4-1・7.1のexit 4統一。2026-10-11 TASK-2で2.4-1の完全一致文言を反映)。TASK-11(Phase B): 旧verify削除によりbackup verify経路へ文言改訂"
description = "構造検査で .age 欠損・age_sizeと実sizeの不一致を検出し、検証エラー4(欠損も不一致と同じく4に統一)。age_sizeは実ファイルsizeと完全一致を要求し、実sizeが記録値未満(切り詰め)・超過(追記)のいずれも不一致としてexit 4となる(記録値未満を警告継続にしない) (unit)"
given = ".age を削除したcaseと、age_size と異なる実sizeの .age のcase(実sizeが記録値を超過するcaseと未満に切り詰めるcaseの両方)の backup verify 実行"
expect_return = "exit code 4(該当recordのsource_pathと期待/実測の詳細表示)"
source_lines = "src/cli.rs:818"

[[condition]]
id = "verify.torn-write-and-bad-json-lines"
target_function = "registry::load_registry"
source = "tmp/tasks/tm-1/design_backup_pipeline.md 8章 VER-003(規則は4.1注記)"
