# --- PR#9レビュー指摘対応(2026-11-21): 書込反映のvalidator束縛・fetch反映のmtime基線 ---

[[condition]]
id = "catalog.written-index-validator-bound-to-uploaded-version"
target_function = "catalog::reflect_written_index_with_db(upload応答VersionIdとの突合) / index::upload_index呼び出し元4経路(backup push・pin add/rm・manage prune系rebuild・manage index rebuild)"
source = "TASK-9設計4章(自端末書込直後のみ無条件fresh) + PR#9コードレビュー指摘(PRRT_kwDOVVJEqc66ZJRo・P2): reflect_written_indexはupload後のHEAD 1回でvalidatorを確定し無条件にfresh化するため、upload→HEAD間に他端末がindexを置換すると他端末のvalidatorと自processの旧entriesの組でfresh確定され、以降のlist/queryがcache hitとして旧内容を受け入れる"
description = "書込系(push/pin/prune等)の索引upload後のDB反映(reflect_written_index)はupload_indexの応答VersionId(put応答)を受け取り、HEAD現行version_idと一致した場合のみfresh化する。不一致(=upload→HEADの間に他端末が索引objectを置換)は当該scopeをstale化して反映を中止する(他端末のvalidatorと自processの旧entriesの組でのfresh化を防ぐ)。upload応答が空(versioning無効bucket=束縛不能)の場合は従来どおりHEAD応答のvalidatorのみで判断する (unit, fake seam)"
given = "FakeS3へindex objectを2回put(1回目=自端末upload想定・2回目=他端末置換想定)した状態でのreflect_written_index_with_db呼出と、一致ケース・不一致ケース・upload応答空ケースでのsync_state.status・load_entries_if_fresh応答の観測"
expect_return_shape = "一致ケースはfresh化されload_entries_if_freshがSome。不一致ケースはErr(他端末書換え検出の警告)となりstatus=stale・現行版validatorでもload_entries_if_freshはNone。upload応答空ケースは従来どおりfresh化(束縛不能)"
source_lines = "src/catalog.rs:2618"

[[condition]]
id = "catalog.mtime-baseline-preserved-on-fetch"
