# amazing-backup テスト設計条件書(catalog エリア)
# 出典: tmp/tasks/tm-9/design_catalog-frontend-auth.md 2章(DB設計・D1/D11)・4章(同期・D10)・
#   5章(CLI照会cache・D7)・12章 Phase P1(DB層)。D1〜D11は2026-11-05ユーザー承認済み。
# 2026-11-04: TASK-9 Phase P1(DB層)対応でテスト先行の条件書(新設feature)。
#   src/catalog.rs は設計12章P1で新設されるmodule(local catalog DB=rusqlite)。
#   実装前のため新条件のテストは実行failを許容(bin subprocess観測: manage catalog系
#   subcommand未実装=exit 64・catalog.db実体の不在等。cargo test --no-runのcompileは通る)。
#   src/catalog.rs内のunit test(schema各tableの詳細構造・WAL mode・migration直接呼出・
#   同一process内無条件fresh等)は実装時に追加する方針(TASK-10段階5・TASK-18と同一構成)。
#   P3以降(serve・API・認証・frontend)の条件は後続waveでserver.toml等へ書く(本ファイル対象外)。
# 2026-11-05: TASK-9 Phase P5(pending catalog)対応でテスト先行の条件追加(6条件)。
#   excluded「pending_items(scan対象明示登録・未backup分類(b')・push dry-run/from-list
#   実行記録(a)の併合・manage catalog scan)」を解消し設計3章(D6承認済み)・12章P5を
#   条件化。実装前のため新条件のテストは実行failを許容(cargo test --no-runのcompileは
#   通る)。設計3章に詳細が規定されない点は以下の解釈で条件化(実装はこれに従う):
#   - scan対象の登録先はpipeline.toml [profiles.<n>.catalog.scan](server.tomlでない)。
#     根拠: scanはCLI(manage catalog scan)・serve(POST /api/pending/scan)の両方から
#     使うbackup対象の定義であり、server.tomlはserver共通設定のみ(設計8章・指摘#13の
#     分離原則=listen_addr/port/rp_id/rp_originのみ)。backup対象はprofile毎に異なる
#     (profile=pipeline/aws.tomlがbackup対象の定義場所)ため[profiles.<n>]配下が対象を
#     profile単位で表現できる唯一の位置。pending_itemsもscope(=profileのbucket+prefix)
#     単位で保持する
#   - section key: roots(必須・絶対path列挙)・extensions(省略可=全regular file対象。
#     ".zip"形式で拡張子比較)・exclude(省略可=除外なし。走査対象の相対pathへの部分一致
#     で除外)。symlinkは既定で辿らない(directory symlinkのtraverse・file symlinkの
#     対象化とも行わない)
#   - 分類の算法: 対象fileをcatalog DB(実効scope)のlocations/versions記録と比較し
#     (1) source_path完全一致の記録がありsize+mtime不一致=changed (2) path一致が無く
#     basename一致の記録のみでsize+mtime不一致=unknown(移動+変更か別内容かをsize+mtime
#     では判定不能。「確認不能」をchanged/unbackedへ偽装しない=設計3章) (3) size+mtime
#     一致(path一致・basename一致のいずれか)=ok (4) path・basenameとも一致する記録が
#     無い=unbacked。mtime比較はfile_write由来のsource_mtime保存値(mtime_jst_precise
#     と同一形式)との文字列比較
#   - CLIのscan集計表示は "scan: <全走査件数>件 unbacked=<n> changed=<n> ok=<n>
#     unknown=<n>"(dry-runのplan行と同一形式)
#   - pending_itemsの置換を行うのは再scanのみ(manage catalog rebuild/syncのcache置換
#     =replace_scopeはpending_itemsに触れない。P1実装の契約「pending_itemsはscan領域の
#     ため対象外」と同一・索引由来でないため)
#   - sha256再計算optionはCLI(manage catalog scan --sha256)のみ。API(POST
#     /api/pending/scan)は既定のsize+mtime比較のみ
# 2026-11-05: TASK-13(serve認証へのapi-key認証追加)対応でテスト先行の条件追加(1条件)・
#   文言改訂(1条件=catalog.schema-migrationの9 tables化。id不変)。出典:
#   tmp/tasks/tm-13/design_api-key-auth.md 2.1(api_keys table・永続class・migration
#   M::up list追加で既存DBへ適用=レビューL-1)・4章。
#   api_keys tableは実装前のためrusqlite直接の行挿入・行数観測は失敗(fail=赤を許容)。
# 2026-11-14: TASK-17 9章W2(TASK-19: tag/collection・audit_log)対応でテスト先行の
#   条件追加(2条件)・文言改訂(1条件=catalog.schema-migrationの13 tables化。id不変)。
#   出典: tmp/tasks/tm-17/design_webui-overall.md 4.1(新table tags/collections/
#   collection_items/audit_log=いずれも永続class)・4.3(tag/collectionはlocal語彙・
#   索引に入れない)・9章W2行・11章(jobs/settingsはW4/W7で本更新の対象外)。
#   テストはsrc/catalog.rs内#[cfg(test)](schema・制約観測)とtests/catalog_storage.rs
#   (rebuildでの永続class保持観測=api_keysと同形式のrusqlite直接読書)で観測。
#   実装前のため新条件のテストは実行failを許容(table不在のrusqlite操作。
#   cargo test --no-runのcompileは通る)。
#   [meta]はテスト先行のためverified=falseへ(W2実装後に全件verifyでtrueへ復帰)。

