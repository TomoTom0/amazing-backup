given = "push+sync済みで索引objectを削除済み(書込履歴あり・HEAD不在)の状態での、registry JSONLへ不正JSON行を追記した状態での manage catalog sync・およびregistry復旧後の再sync"
expect_return_shape = "registry破損時はexit 4(処理エラー)でsync_state.status=error。registry復旧後は索引不在の案内エラー経路へ戻る(exit 2・status=stale)"
