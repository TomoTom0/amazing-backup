# amazing-backup テスト設計条件書(catalog エリア)
# 出典: tmp/tasks/tm-9/design_catalog-frontend-auth.md 2章(DB設計・D1/D11)・4章(同期・D10)・
#   5章(CLI照会cache・D7)・12章 Phase P1(DB層)。D1〜D11は2026-11-05ユーザー承認済み。
# 2026-11-04: TASK-9 Phase P1(DB層)対応でテスト先行の条件書(新設feature)。
#   src/catalog.rs は設計12章P1で新設されるmodule(local catalog DB=rusqlite)。
#   実装前のため新条件のテストは実行failを許容(bin subprocess観測: manage catalog系
#   subcommand未実装=exit 64・catalog.db実体の不在等。cargo test --no-runのcompileは通る)。
#   src/catalog.rs内のunit test(schema各tableの詳細構造・WAL mode・migration直接呼出・
#   同一process内無条件fresh等)は実装時に追加する方針(TASK-10段階5・TASK-18と同一構成)。
#   P3以降(serve・API・認証・frontend)の条件は後続waveでserver.toml等へ書く(本ファイル対象外)。

[meta]
feature = "catalog"
source_file = "src/catalog.rs"
verified = true
verified_at = "2026-11-05"
verified_by = "claude"
test_command = "cargo test"
source_hash = "1c4f552603ff471938ebe587b57b1bf2aab395ab"
note = "TASK-9設計2章(DB層)・4章(replica同期)・5章(CLI照会cache)・12章P1の条件化。DB真正はJSONL registryのまま・DBは導出index+S3索引replica(平文view・D11承認)。テストはbin subprocess+fake seam(StorageFixture)で観測しsrc/catalog.rs直接参照のunit testは実装時に追加"

[[condition]]
id = "catalog.db-path-and-file-permissions"
target_function = "catalog::db_path解決 / DB open(作成時権限)"
source = "tmp/tasks/tm-9/design_catalog-frontend-auth.md 2章(D1/D11・格納先と権限)"
description = "catalog DBの格納先は$XDG_STATE_HOME/amazing-backup/catalog.db(AMAZING_BACKUP_HOME指定時は$ABH/catalog.db=ABH統合則。resolve_app_pathsのregistryと同一規則)。DBは平文replicaを含むため(D11承認)専用directoryは0700・DB本体・WAL/SHM・一時fileは0600で作成する(group/other読取不可の権限境界) (integration, fake seam)"
given = "AMAZING_BACKUP_HOME=<dir>指定での manage catalog sync 実行と、XDG_STATE_HOME=<dir>指定(ABH未指定)での manage catalog sync 実行"
expect_return_shape = "ABH指定時は$ABH/catalog.db・XDG_STATE_HOME指定時は<dir>/amazing-backup/catalog.dbが作成され、DB fileのpermissionはmode & 0o077 == 0。XDG_STATE_HOME側の専用directory(<dir>/amazing-backup/)もmode & 0o077 == 0で作成される"
source_lines = "tests/catalog_storage.rs:33"

[[condition]]
id = "catalog.schema-migration"
target_function = "catalog::migrations(rusqlite_migration)"
source = "tmp/tasks/tm-9/design_catalog-frontend-auth.md 2章(schema要約・table契約)・12章P1(schema/migration)"
description = "DB新規作成はmigrationによりschemaを構築する: cache class 6 table(entities/versions/pins/locations/sync_state/pending_items)+永続class 2 table(credentials/push_intents)。versions/locationsはfile_write由来のsource_mtimeを保存する(3章の比較基準供給源)。migrationは冪等(既存DBへの再適用で内容を壊さない)。WAL modeで運用する (unit; integrationではDB file生成を観測)"
given = "存在しないpathへの初回DB作成(manage catalog sync実行)と、同一DBへの再実行"
expect_return_shape = "初回実行でSQLite database file(magic header \"SQLite format 3\")が作成され後続の照会が動作。再実行はexit 0で既存内容を壊さない(schema各tableの詳細構造・WAL modeの直接観測はsrc/catalog.rs実装時のunit test)"
source_lines = "src/catalog.rs:1105; src/catalog.rs:989; tests/catalog_storage.rs:85"

[[condition]]
id = "catalog.sync-fetches-replica-on-change"
target_function = "manage catalog sync(replica取得)"
source = "tmp/tasks/tm-9/design_catalog-frontend-auth.md 4章(D10遅延refresh・validator取得・freshness整合規則)・12章P1"
description = "manage catalog syncはHEAD 1回で索引objectのvalidator(ETag+VersionId。S3Backend/FakeS3へのvalidator取得追加)を取得しsync_stateのvalidatorと比較する: 変化(初回含む)あればGET+復号し当該scopeのcache行を置換、fetched_at・validatorを取得内容としてsync_stateへ確定する。変化なければGETを行わない(毎回の索引GETを廃止=要件1)。転送・復号失敗時はsync_state.status=error(staleness明示) (integration, fake seam)"
given = "索引objectが無い状態での初回 manage catalog sync・2回目sync(変化なし)・索引objectを書換えた後の3回目sync"
expect_return_shape = "初回は索引keyへのHeadObject+GetObjectが呼ばれexit 0(同期時にDB file生成)。2回目はHeadObjectのみでGetObjectは呼ばれない。書換え後は再度GetObjectが呼ばれexit 0"
source_lines = "tests/catalog_storage.rs:113"

[[condition]]
id = "catalog.list-cache-hit-after-head-check"
target_function = "照会系CLI(list files/versions/pins/runs・query)のcache利用"
source = "tmp/tasks/tm-9/design_catalog-frontend-auth.md 4章(freshness整合規則=別process起動時HEAD 1回 validator確認必須)・5章(D7承認: 検証済みfresh時DB利用)・12章P1(cache hit/miss両経路)"
description = "list files/versions/pins/runs・queryは別process起動時にHEAD 1回のvalidator一致確認を行い、検証済みfreshならS3 GETを行わずDBから回答する(cache hit。HEADとGETの毎回取得を廃止)。HEAD validator一致確認は毎process起動時に必須(検証なしfreshの持ち越し期限は設けない) (integration, fake seam)"
given = "manage catalog sync済み(fresh)状態での list files と query の実行(いずれもsyncとは別process)"
expect_return_shape = "索引objectへのHeadObject 1回のみでGetObjectは呼ばれず、表示結果はS3索引の内容と一致する"
source_lines = "src/catalog.rs:1190; tests/catalog_storage.rs:163"

[[condition]]
id = "catalog.cache-miss-refreshes-db"
target_function = "照会系CLI(stale時の従来経路+DB更新)"
source = "tmp/tasks/tm-9/design_catalog-frontend-auth.md 5章(D7: staleなら従来経路のS3 GET+復号→DB更新)・4章(取得失敗時のstaleness扱い)"
description = "validator不一致(stale)時は従来経路(S3 GET+復号)で回答し、取得内容をDBへ反映する(次回起動はcache hit)。取得失敗(転送・復号)時は旧cacheをstaleness明示付きで扱い、sync_state.status=errorとする(旧fresh状態を残さない) (integration, fake seam)"
given = "sync後に索引objectを書換えた(validator変化)状態での list files 実行と、転送失敗注入(FAKE_S3_FAIL_CP_FOR=索引key)での list files 実行"
expect_return_shape = "書換え後のlistは索引keyへGetObject 1回を行いexit 0でDBが更新される(続く再実行はcache hit=GetObject無し)。失敗注入時は転送エラー(exit 5)で、DBはfreshとして持ち越されない"
source_lines = "tests/catalog_storage.rs:210"

[[condition]]
id = "catalog.append-then-reflect-with-stale-on-failure"
target_function = "backup push(書込系のDB反映) / catalog::reflect"
source = "tmp/tasks/tm-9/design_catalog-frontend-auth.md 2章(書込時序: JSONL append成功→同一process内でDB反映・反映失敗時のstale化)"
description = "backup push等の書込系はJSONL registry append成功後、同一process内で当該scopeのDBへ反映する(反映済み=自端末書込snapshot。次の照会はcache hit)。DB反映失敗(DB file破損等)時は当該scopeをstale化して警告表示する(旧fresh状態を残さない。JSONLが正本のためpush自体は成功継続) (integration, fake seam)"
given = "通常のbackup push実行後のlist files(cache hit観測)と、catalog.dbを不正bytesで事前配置した状態でのbackup push実行"
expect_return_shape = "通常時はpush後のlistがcache hit(索引objectへのHeadObject 1回・GetObject無し)。破損DB配置時はpushはexit 0でDB反映失敗の警告がstderrへ表示され、続くlistはS3経路(GetObjectあり)で回答する"
source_lines = "tests/catalog_storage.rs:269"

[[condition]]
id = "catalog.rebuild-scoped-to-cache-class"
target_function = "manage catalog rebuild"
source = "tmp/tasks/tm-9/design_catalog-frontend-auth.md 2章(table契約: rebuildはcache classのみ置換・永続classはdropしない)・11章(rebuild冪等)・12章P1"
description = "manage catalog rebuildはローカルregistry(JSONL)からcache class(entities/versions/pins/locations/sync_state/pending_items)のみを置換再構築し、永続class(credentials/push_intents)はdropしない。再実行で同一内容(冪等)。cacheは常にJSONL+S3から再構築可能 (integration, fake seam; 永続class保持の直接観測はsrc/catalog.rs実装時のunit test)"
given = "sync済みDBへの manage catalog rebuild 2回実行と、rebuild後のlist files実行"
expect_return_shape = "rebuildはexit 0でS3索引由来と同一の照会結果をDBから回答し、2回のrebuild後のlist結果は同一(冪等)"
source_lines = "src/catalog.rs:1128; tests/catalog_storage.rs:327"

[[condition]]
id = "catalog.scope-isolation-multi-profile"
target_function = "catalog(cache tableのscope列)"
source = "tmp/tasks/tm-9/design_catalog-frontend-auth.md 2章(指摘#3: 全cache tableにscope(bucket+prefix)を持ち混在時の衝突・上書き防止)"
description = "全cache tableはscope(bucket+prefix)をPK/検索条件に持つ: 複数profile=複数scopeの混在時に対象scope外のcache行への衝突・上書きが起きない(一方のscopeの同期・書込反映が他方のscopeのcacheを消さない。profile切替での照会は各scopeの内容のみ) (integration, fake seam)"
given = "別prefixの2 profile(dev・prod。pipeline.toml側にも同名profile)でそれぞれpush+manage catalog syncした構成での、各profileでのlist files実行"
expect_return_shape = "各profileのlistは当該scopeの索引内容のみを表示し他scopeのentityは混入せず、両scopeのcacheは併存する(後からsyncした側が先の側を上書きしない)"
source_lines = "tests/catalog_storage.rs:353"

