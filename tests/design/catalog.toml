[[condition]]
id = "catalog.cache-miss-refreshes-db"
target_function = "照会系CLI(stale時の従来経路+DB更新)"
source = "tmp/tasks/tm-9/design_catalog-frontend-auth.md 5章(D7: staleなら従来経路のS3 GET+復号→DB更新)・4章(取得失敗時のstaleness扱い)"
description = "validator不一致(stale)時は従来経路(S3 GET+復号)で回答し、取得内容をDBへ反映する(次回起動はcache hit)。取得失敗(転送・復号)時は旧cacheをstaleness明示付きで扱い、sync_state.status=errorとする(旧fresh状態を残さない) (integration, fake seam)"
