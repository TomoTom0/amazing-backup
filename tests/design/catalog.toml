[[condition]]
id = "catalog.sync-fetches-replica-on-change"
target_function = "manage catalog sync(replica取得)"
source = "tmp/tasks/tm-9/design_catalog-frontend-auth.md 4章(D10遅延refresh・validator取得・freshness整合規則)・12章P1"
description = "manage catalog syncはHEAD 1回で索引objectのvalidator(ETag+VersionId。S3Backend/FakeS3へのvalidator取得追加)を取得しsync_stateのvalidatorと比較する: 変化(初回含む)あればGET+復号し当該scopeのcache行を置換、fetched_at・validatorを取得内容としてsync_stateへ確定する。変化なければGETを行わない(毎回の索引GETを廃止=要件1)。転送・復号失敗時はsync_state.status=error(staleness明示)。初回(=local registry・sync_stateともに無い状態)でもremoteのHEAD確認を省略しない(local履歴の不在はremote索引の不在の証拠にならない=別端末・復旧環境ではS3の索引を取得する)。HEAD失敗もstatus=errorへの失効経路へ集約する(正常DBのまま旧freshを残さない) (integration, fake seam)"
given = "索引objectが無い状態での初回 manage catalog sync・2回目sync(変化なし)・索引objectを書換えた後の3回目sync。およびlocalのregistry・catalog DBを削除した状態(別端末相当・remoteには索引が存在)での初回sync"
expect_return_shape = "初回は索引keyへのHeadObject+GetObjectが呼ばれexit 0(同期時にDB file生成)。2回目はHeadObjectのみでGetObjectは呼ばれない。書換え後は再度GetObjectが呼ばれexit 0。別端末相当の初回syncはremote索引をHEAD確認のうえ取得し内容が同期される(空をfresh確定しない)"
source_lines = "tests/catalog_storage.rs:175; tests/catalog_storage.rs:225; tests/catalog_storage.rs:434"

[[condition]]
id = "catalog.sync-invalidation-on-replace-failure-and-missing-index"
target_function = "manage catalog sync(置換失敗・索引object不在時の失効)"
source = "tmp/tasks/tm-9/design_catalog-frontend-auth.md 4章(D10遅延refresh・freshness整合規則: 失効時に旧freshを持ち越さない)・TASK-9レビュー再指摘#6(syncのreplace_scope失敗・書込履歴ありnamespaceの索引object不在が失効処理を通らない)"
description = "manage catalog syncはremote索引のGETに成功してもcache置換(replace_scope)が失敗した場合はstatus=errorへ失効してからエラー終了し、書込履歴があるnamespaceでremote索引objectが不在(HEADで不在確認)の場合はstatus=staleへ失効してから案内エラー終了する(いずれも正常DBのままで置換失敗・rollback後・不在確認後に旧freshを残さない。失効は一時的で再実行成功でfresh復帰) (integration, fake seam)"
given = "push+sync済み(fresh)の正常DBでの、versions挿入のみ失敗させるtrigger注入+索引object書換え(validator変化)後の manage catalog sync・trigger解除後の再sync・および索引objectを削除した状態(書込履歴あり・HEAD不在)での manage catalog sync"
expect_return_shape = "置換失敗注入時はexit 1(内部エラー)でsync_state.status=error。trigger解除後の再syncはexit 0でfresh復帰。索引object不在時はexit 2(案内エラー)でstatus=stale・復旧案内(manage index rebuild)をstderrへ表示"
source_lines = "tests/catalog_storage.rs:492"

[[condition]]
