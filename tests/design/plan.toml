# 2026-10-09: テスト全件PASS・verify-conditions.py PASSを確認し[meta]へ検証記録を書いた(レビュー指摘12件対応で条件追加・更新した際)。
# 2026-10-14: TASK-10(S3ストレージ設計)の棚卸し(tmp/tasks/tm-10/design_s3_storage.md 9章表・7.3):
#   Phase Aは旧plan凍結のため全条件無変更。Phase Bで name override系2条件(name-override-basename-validation・
#   output-name-collision-error)が廃止→layout.*が引継ぎ。該当2条件のsource欄へTASK-10出典を追記。
# 2026-10-15: TASK-11(Phase B)対応でテスト先行の更新(TASK-11 body+tmp/tasks/tm-10/design_s3_storage.md 7.3/9章)。
#   旧planサブコマンド削除に伴う棚卸し:
#   廃止4件: plan.name-override-basename-validation・plan.output-name-collision-error(name override撤廃。
#     layout.key-generation-*が引継ぎ)・plan.recipient-fingerprint-display(plan表示経路の消滅。指紋計算自体は
#     fingerprint.matches-ssh-keygenが担保)・plan.runs-without-aws(plan経路の消滅。backup pushはaws設定を要する
#     統合runのため旧planの「aws不要」性質は引き継がれない)
#   文言改訂(廃止しない): 対象解決共通経路(targets.rs。backup pushでも通る)5条件を実行経路backup pushへ改訂。
#   実装前のため改訂期待値のテストは実行failを許容し[meta]はverified=falseのまま。

[meta]
feature = "plan"
source_file = "src/targets.rs"
verified = true
verified_at = "2026-10-22"
verified_by = "claude"
test_command = "cargo test"
source_hash = "8f2760f80a5de9b3f8b811f924943201d1ba28d0"
note = "対象解決(targets.rs)の条件群。TASK-11(Phase B)で旧planサブコマンドが削除され、対象解決はbackup push(push解決+--dry-run)経路で検証する(旧plan表示経路は消滅)。各条件のdescription末尾 (unit)/(integration) は階層の目安"

[[condition]]
id = "plan.resolves-positional-targets"
target_function = "targets::resolve_targets / backup push(対象解決)"
source = "tmp/tasks/tm-1/design_backup_pipeline.md 8章 PLAN-001(表示・集計仕様は2.1)。TASK-11(Phase B): 旧plan削除によりbackup push --dry-run経路へ文言改訂"
description = "位置引数のみで対象解決され、各対象のpath・サイズ・mtime・合計サイズが表示される(backup push --dry-runの対象解決表示) (unit)"
given = "存在する .zip と .7z の2件を位置引数に指定して backup push --dry-run を実行"
expect_return_shape = "解決対象2件のpath・size・mtimeと合計サイズを含む表示と exit code 0"
source_lines = "src/targets.rs:281"

[[condition]]
id = "plan.from-list-union"
target_function = "targets::resolve_targets / targets::parse_from_list"
source = "tmp/tasks/tm-1/design_backup_pipeline.md 8章 PLAN-002(--from-list仕様は2.5)。TASK-11(Phase B): 旧plan削除によりbackup push経路へ文言改訂"
description = "--from-list と位置引数の和集合が解決される(backup pushの対象解決) (unit)"
given = "位置引数1件と、別の1件を含む from-list toml を同時に指定した backup push --dry-run 実行"
expect_return_shape = "和集合の2件が解決・表示され exit code 0"
source_lines = "src/targets.rs:307"

[[condition]]
id = "plan.missing-or-dir-target-error"
target_function = "targets::resolve_targets"
source = "tmp/tasks/tm-1/design_backup_pipeline.md 8章 PLAN-003(解決規則は3.1-1)。TASK-11(Phase B): 旧plan削除によりbackup push経路へ文言改訂"
description = "対象不在・directory指定は対象エラー。解決段階のエラーは全件列挙後に一度に失敗する(backup pushの対象解決) (unit)"
given = "存在しないpathとdirectory pathを対象に指定した backup push 実行"
expect_throw = "TargetError(exit code 3)"
source_lines = "src/targets.rs:326"

[[condition]]
id = "plan.extension-whitelist"
target_function = "targets::resolve_targets"
source = "tmp/tasks/tm-1/design_backup_pipeline.md 8章 PLAN-004(解決規則は3.1-2)。TASK-11(Phase B): 旧plan削除によりbackup push経路へ文言改訂"
description = "拡張子は .zip/.7z のみ許容(大文字小文字無視)。.tar.gz・.7z.001 分割等は対象エラー(backup pushの対象解決) (unit)"
given = "対象候補に .tar.gz・.7z.001(対象外)と大文字 .ZIP(許容)を含む backup push 実行"
expect_throw = "TargetError(exit code 3)。大文字 .ZIP のみ解決される"
source_lines = "src/targets.rs:343"

[[condition]]
id = "plan.realpath-duplicate-error"
target_function = "targets::resolve_targets"
source = "tmp/tasks/tm-1/design_backup_pipeline.md 8章 PLAN-005(解決規則は3.1-3)。TASK-11(Phase B): 旧plan削除によりbackup push経路へ文言改訂"
description = "解決後realpathの重複(位置引数×from-list間含む)は対象エラー(backup pushの対象解決) (unit)"
given = "同一ファイルを相対path・絶対path・from-list entryで重複指定した backup push 実行"
expect_throw = "TargetError(exit code 3)"
source_lines = "src/targets.rs:366"
