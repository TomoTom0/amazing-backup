[meta]
feature = "frontend"
source_file = "frontend/src/"
verified = true
verified_at = "2026-11-05"
verified_by = "claude"
test_command = "pnpm --dir frontend vitest run"
source_hash = "4afa2bbecccc90f9223556fe20d6dcb6ab60c981"
note = "TASK-9設計7章(frontend構成・Pinia stores)・6章(error body形式)・4章(staleness)・12章P3時点のfrontend期待動作。API client(src/api/client.ts)とsync store(src/stores/sync.ts)のvitestで担保(画面の本格実装はP4/P5)。source_hashはfrontend/src配下のgit tree hash(directory対象のためblob hashの代用)"

[[condition]]
id = "frontend.api-error-body-guard"
target_function = "frontend api/client.ts isApiErrorResponse"
source = "tmp/tasks/tm-9/design_catalog-frontend-auth.md 6章(指摘#14: error bodyは{\"error\":{\"code\",\"message\"}}形式・一般化messageのみ)・7章(api/client)・11章(frontend test=vitest)"
description = "API clientはerror body形式({\"error\":{\"code\",\"message\"}}・code/messageともstring)を型ガードで判定し、不一致(形式違い・null・code非string等)を検出する (vitest)"
given = "isApiErrorResponseへの合成入力(形式一致・code非string・message欠落・空object・null)"
expect_return_shape = "形式一致のみtrue・他はfalse"
source_lines = "frontend/src/api/client.spec.ts:6"

[[condition]]
id = "frontend.api-get-result-mapping"
target_function = "frontend api/client.ts apiGet"
source = "tmp/tasks/tm-9/design_catalog-frontend-auth.md 6章(指摘#14: 非2xxはerror code+HTTP status)・7章(api/client・型ガードで検証し不一致はinternal扱い)・11章(vitest)"
description = "apiGetは成功(2xx+型ガード通過)は{ok:true,data}・非2xxでerror body形式なら{ok:false,error:{code,message},httpStatus}・network失敗は{ok:false,error:{code:\"network\"},httpStatus:0}・2xxでも型ガード不一致は{ok:false,error:{code:\"internal\"}}へ結果をmappingする (vitest)"
given = "fetchのmock(200+ガード通過body・503+{\"error\":{\"code\":\"configuration\",...}}・network reject・200+形式不一致body)でのapiGet呼び出し"
expect_return_shape = "各入力を上記のok/error/httpStatusへ一方にmapping(guard通過data・error code・httpStatus=503/0)"
source_lines = "frontend/src/api/client.spec.ts:30"

[[condition]]
id = "frontend.health-state-store"
target_function = "frontend stores/sync.ts fetchHealth"
source = "tmp/tasks/tm-9/design_catalog-frontend-auth.md 7章(Pinia stores・sync)・12章P2(liveness表示)・11章(vitest)"
description = "sync storeのfetchHealthはhealth状態(checking→ok/error)とmessageを遷移させ、失敗時はlastError(ApiError)を保持する(P2のliveness表示。P3以降のstaleness表示の基盤) (vitest)"
given = "setActivePinia後のsync storeへのfetch mock(200+{status:\"ok\"}とnetwork reject)"
expect_return_shape = "成功時health=ok・message=ok・lastError=null。失敗時health=error・lastError={code:\"network\",...}"
source_lines = "frontend/src/stores/sync.spec.ts:15"

[[condition]]
id = "frontend.sync-state-endpoint-client"
target_function = "frontend api/client.ts GET /api/sync応答型ガード・stores/sync.ts sync状態取得"
source = "tmp/tasks/tm-9/design_catalog-frontend-auth.md 6章(endpoint一覧: GET /api/sync=sync状態fetched_at/validator/staleness)・4章(D10: frontendにstaleness表示+手動refresh)・7章(stores/sync)・12章P3"
description = "GET /api/sync応答(status=fresh|stale|error|unknown・scope・index_etag/index_version_id・fetched_at/last_write_at/last_verified_at・entry_count)の型ガードを持ち、sync storeはsync状態を取得して保持する(手動refreshのUI表示基盤。P3時点では保護APIのためAPI未構成状態からの応答は503 error扱い) (vitest)"
given = "合成入力への型ガード呼び出しと、fetch mock(503+{\"error\":{\"code\":\"configuration\",...}}・200+sync状態body)でのstoreのsync状態取得"
expect_return_shape = "型ガードは形式一致のみtrue。storeは200時にsync状態(status等)を保持し、503ではlastError(configuration)を保持する(実装前のため本条件のテストは実行failを許容)"
source_lines = "frontend/src/api/sync-state.spec.ts:18"

[[condition]]
id = "frontend.fail-closed-protected-api-handling"
target_function = "frontend api/client.ts・stores/sync.ts(保護API 503の扱い)"
source = "tmp/tasks/tm-9/design_catalog-frontend-auth.md 12章P2〜P3(保護APIはP4までfail-closed=503 configuration)・指摘#11・6章(error code体系)・7章(HomeViewの閉鎖表示)"
description = "保護API(読取系)が未認証で503(configuration)を返すP2〜P3段階では、frontendはapiGetのerror扱い(code=configuration+httpStatus=503)としてdataの表示を行わず、閉鎖されている状態をlastError・UI文案で示す(認証未構成時に空dataを表示しない) (vitest)"
given = "fetch mock(503+{\"error\":{\"code\":\"configuration\",\"message\":...}})でのapiGet経由の保護API呼び出しとsync storeのerror状態"
expect_return_shape = "ok=false・error.code=configuration・httpStatus=503としてstoreのlastErrorに保持されdataは返らない"
source_lines = "frontend/src/api/client.spec.ts:31"

