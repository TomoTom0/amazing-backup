[[condition]]
id = "frontend.entity-rename-client-and-store"
target_function = "frontend client renameEntity / entities store renameEntity"
source = "TASK-17設計(tmp/tasks/tm-17/design_webui-overall.md) 2.2(名前変更: title編集form(64文字・/・改行・制御文字拒否はCLIと同一規則)→POST /api/entities/:uuid/rename)・3.2(rename API・title重複は許容+警告応答)・3.3(書込APIのsemaphore待ちで遅延し得るためfrontendは書込form送信時にpending状態表示)・9章W3行・11章(frontend.toml: 新store条件)"
description = "renameEntity clientはPOST /api/entities/<uuid>/renameへ{title} bodyを送り応答(EntityDetail形式+warning(重複時のみ)を型ガードで検証)を返す。entities storeのrenameEntity actionは応答でdetailを更新(操作後に再GET不要=3.1方針)し・title変更は一覧表示に影響するため取得済みなら現在の絞り込みで一覧を再取得する。実行中はrenameSaving=true(Viewはtitle編集UIを無効化=tagEditSavingと対)・失敗(422等)はlastRenameErrorで示しdetailは旧状態のまま。重複警告はlastRenameWarningへ保持し成功時クリア (unit)"
given = "fetchをstubした応答(200 EntityDetail+warning付き/無し・422 error body)でのclient呼出とstore action実行"
expect_return_shape = "clientはPOST /api/entities/<uuid>/renameへ{title}を送る。storeは成功時detail.title=新title・lastRenameError=null・warning有りならlastRenameWarning=文言(無しならnull)・fetchedならfetchEntities再実行。失敗時detail不変+lastRenameError設定。renameSavingは実行中のみtrue"
source_lines = "frontend/src/api/entity-rename.spec.ts:50; frontend/src/stores/entities.spec.ts:869"

[[condition]]
id = "frontend.entity-location-edit-client-and-store"
target_function = "frontend client updateEntityLocation / entities store updateLocation"
source = "TASK-17設計(tmp/tasks/tm-17/design_webui-overall.md) 2.2(folder変更: 所在行ごとのcategory/label編集form→POST /api/entities/:uuid/location)・3.2(location API・不在は404)・3.3(pending状態表示)・9章W3行・11章"
description = "updateEntityLocation clientはPOST /api/entities/<uuid>/locationへ{source_path, category, label} bodyを送り応答(EntityDetail形式)を返す。entities storeのupdateLocation actionは応答でdetailを更新し・所在変更はfolder一覧ビューに影響するため取得済みなら一覧を再取得する。実行中はlocationSaving=true・失敗はlastLocationErrorで示しdetailは旧状態のまま (unit)"
given = "fetchをstubした応答(200 EntityDetail・404/422 error body)でのclient呼出とstore action実行"
expect_return_shape = "clientはPOST /api/entities/<uuid>/locationへ{source_path,category,label}を送る。storeは成功時detail.locations=操作後の所在・lastLocationError=null・fetchedならfetchEntities再実行。失敗時detail不変+lastLocationError設定。locationSavingは実行中のみtrue"
source_lines = "frontend/src/api/entity-location.spec.ts:41; frontend/src/stores/entities.spec.ts:988"

[[condition]]
id = "frontend.two-step-confirm-state"
target_function = "frontend composables useTwoStepConfirm(2段階確認部品の状態)"
source = "TASK-17設計(tmp/tasks/tm-17/design_webui-overall.md) 8章(新規部品2段階確認: button「実行」→同位置が「確認して実行」(btn-primary)へ置換+escapable。dialog不使用)・6章(危険操作の追加ガード=UI側確認ステップ・browser dialog禁止のためinlineの2段階button)・9章W3行(2段階確認部品)・11章(frontend.toml: 2段階確認状態)"
description = "2段階確認の状態logic(composable): 初期は非armed(部品は通常labelのbutton)。1回目の操作要求でarmedへ遷移(部品は確認labelのbtn-primaryへ置換)し・armed状態での2回目の操作要求が実行確定(呼び出し側はこの戻りで書込を実行)となりarmedは解除される。escapable: Esc keydownでarmedを解除する(誤armedの取り消し)。解除は外部からの明示cancelでも可能(blur等) (unit)"
given = "useTwoStepConfirmの初期状態・advance(1回目)・advance(2回目)・Esc keydown・cancelの各操作"
expect_return_shape = "初期armed=false・1回目advanceは'armed'を返しarmed=true・2回目advanceは'confirmed'を返しarmed=falseへ戻る・Esc keydown(armed時)はarmed=false・cancelもarmed=false(非armed時のEsc/cancelは状態不変)"
source_lines = "frontend/src/composables/two-step-confirm.spec.ts:11"
