# amazing-backup テスト設計条件書(frontend エリア)
# 出典: tmp/tasks/tm-9/design_catalog-frontend-auth.md 7章(frontend構成)・
#   6章(API設計・error体系=指摘#14)・4章(D10 staleness表示)・11章(frontend.toml・
#   scanner拡張=指摘#12)・12章Phase P2(frontend最小build)・P3(読取API・vitest緑)。
#   D1〜D11は2026-11-05ユーザー承認済み。
# 2026-11-05: TASK-9 Phase P3(読取API)waveで新設(テスト先行)。設計11章・12章P3の
#   「verify-conditions.pyのTS走査拡張」と合わせ、frontend/src配下の期待動作を
#   条件化する(P2のexcluded(server.toml側)からfrontend/src配下のvitest対象分を移管)。
#   P3時点で観測可能な条件のみ。P4(LoginView・passkey)・P5(PendingView・scan)分は
#   excludedへ(後続waveで条件化)。テストはvitest(frontend/src/**/*.spec.ts)で
#   `// [covers:<id>]`形式で紐付け(verify-conditions.pyのTS/Vue走査)。
#   実装前のためfrontend.sync-state-endpoint-client分のテストは実行failを許容
#   (pnpm vitest runは実行可能・client.tsへのGET /api/sync対応はP3実装で追加)。
# 2026-11-05: TASK-9 Phase P4(passkey認証)対応でテスト先行の条件追加(4条件)。
#   excluded「LoginView・passkey認証UI」分を解消しauth store(src/stores/auth.ts)・
#   client(src/api/client.tsのauth系)層を条件化。実装前のため新条件のテストは
#   実行failを許容(pnpm vitest runは実行可能)。実browserのWebAuthn API
#   (navigator.credentials.create/get)観測はexcluded維持(vitestはnode環境のため
#   store/client層のみ条件化し、LoginViewのUI誘導状態はauth storeのgetterで担保)。
#   GET /api/auth/status応答形式はserver.tomlの解釈({authenticated,credentials})に整合。
# 2026-11-05: TASK-9 Phase P5(pending catalog)対応でテスト先行の条件追加(2条件)。
#   excluded「PendingView(未backup/changed/unknown一覧+scanボタン)・pending周りのUI」を
#   解消しpending store(src/stores/pending.ts)・client(src/api/client.tsのpending系)層を
#   条件化。実装前のため新条件のテストは実行failを許容(pnpm vitest runは実行可能)。
#   PendingView componentの実描画はvitest(node環境)で観測できないためexcluded維持
#   (P4のLoginViewと同一扱い)。一覧のUI状態はstoreのstatus別集計getter(counts)で担保し
#   scan実行はrunScan action(POST後に一覧再取得)で担保する。
#   GET /api/pending応答・POST /api/pending/scan応答の形式はserver.toml P5条件の解釈
#   ({"pending":[...]}・item schema共通)に整合。
# 2026-11-05: TASK-9 Phase P6(diff UI)対応でテスト先行の条件追加(3条件)。
#   server.toml excluded「diff UI(P6: diff結果のfrontend画面表示)」を解消しdiff
#   client(src/api/client.tsのdiff系)・diff store(src/stores/diff.ts)層を条件化。
#   実装前のため新条件のテストは実行failを許容(pnpm vitest runは実行可能)。
#   設計7章の画面一覧にdiff結果画面は列挙されていないため、12章P6のdiff UIは
#   DiffView(view)として実装する(component実描画はvitest=node環境で観測できない
#   ためexcludedへ=P4 LoginView・P5 PendingViewと同一扱い。UI誘導状態はstoreの
#   diffView getter・結果集計はsummary getterで担保する)。
#   POST /api/diffの応答はdiff結果そのもののためP5 runScanのような実行後の再GETは
#   行わない。GET /api/diffは未実行時404 not_found(server.diff-endpointsの解釈)を
#   error扱いで返し、diffView getterは未実行(not_run)へ接続する(未実行と未認証401
#   などの失敗をUI状態として区別)。
# 2026-11-05: TASK-9コードレビュー指摘高4(承認済みの主要frontend機能が未実装=
#   HomeViewのentity一覧・検索・絞込・詳細画面が「後続phase」表示のまま・手動syncの
#   client/store/UIも無い)対応でテスト先行の条件追加(5条件)・excluded 1件追加。
#   設計7章(EntitiesView=一覧・検索・絞込・sync状態+refresh・EntityDetailView)・
#   4章(D10: 手動refresh=POST /api/sync+staleness表示)・6章(GET /api/entitiesの
#   query/category/label/page/scope絞込・:uuid・:uuid/versions)のD8承認(閲覧)分。
#   実装前のため新条件のテストは実行failを許容(pnpm vitest runは実行可能)。
#   解釈の確定(設計に詳細が規定されない点):
#   - GET /api/entities応答のwrap・要素schemaはserver.entities-list-endpointの解釈に
#     整合({entities:[entry_summary語彙], page, total_pages}・page=1始点)。詳細・
#     versions応答もserver.entity-detail-endpoint・entity-versions-endpointに整合
#   - fetchEntitiesの絞り込みparamは値のあるparamのみURL queryへ直列化する
#     (scope省略時はserver側実効profile=server.read-api-uses-serve-profile)
#   - POST /api/sync応答はGET /api/syncと同一形式(server.sync-refresh-endpoint)。
#     手動refresh後のentities一覧再取得はsync storeのrefresh action内で行う
#     (EntitiesViewの実描画はexcludedのためstore層で観測する解釈)
#   - routes配列はvitest(node環境)からimport可能なfrontend/src/router/routes.tsと
#     してrouter/index.tsから切出す=createWebHistoryがnodeで動かないための観測seam
#   - EntitiesView・EntityDetailView componentの実描画・HomeViewのnav link実描画・
#     router guardの実navigationはP4 LoginView〜P6 DiffViewと同一扱いでexcludedへ

