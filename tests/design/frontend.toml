# amazing-backup テスト設計条件書(frontend エリア)
# 出典: tmp/tasks/tm-9/design_catalog-frontend-auth.md 7章(frontend構成)・
#   6章(API設計・error体系=指摘#14)・4章(D10 staleness表示)・11章(frontend.toml・
#   scanner拡張=指摘#12)・12章Phase P2(frontend最小build)・P3(読取API・vitest緑)。
#   D1〜D11は2026-11-05ユーザー承認済み。
# 2026-11-05: TASK-9 Phase P3(読取API)waveで新設(テスト先行)。設計11章・12章P3の
#   「verify-conditions.pyのTS走査拡張」と合わせ、frontend/src配下の期待動作を
#   条件化する(P2のexcluded(server.toml側)からfrontend/src配下のvitest対象分を移管)。
#   P3時点で観測可能な条件のみ。P4(LoginView・passkey)・P5(PendingView・scan)分は
#   excludedへ(後続waveで条件化)。テストはvitest(frontend/src/**/*.spec.ts)で
#   `// [covers:<id>]`形式で紐付け(verify-conditions.pyのTS/Vue走査)。
#   実装前のためfrontend.sync-state-endpoint-client分のテストは実行failを許容
#   (pnpm vitest runは実行可能・client.tsへのGET /api/sync対応はP3実装で追加)。
# 2026-11-05: TASK-9 Phase P4(passkey認証)対応でテスト先行の条件追加(4条件)。
#   excluded「LoginView・passkey認証UI」分を解消しauth store(src/stores/auth.ts)・
#   client(src/api/client.tsのauth系)層を条件化。実装前のため新条件のテストは
#   実行failを許容(pnpm vitest runは実行可能)。実browserのWebAuthn API
#   (navigator.credentials.create/get)観測はexcluded維持(vitestはnode環境のため
#   store/client層のみ条件化し、LoginViewのUI誘導状態はauth storeのgetterで担保)。
#   GET /api/auth/status応答形式はserver.tomlの解釈({authenticated,credentials})に整合。
# 2026-11-05: TASK-9 Phase P5(pending catalog)対応でテスト先行の条件追加(2条件)。
#   excluded「PendingView(未backup/changed/unknown一覧+scanボタン)・pending周りのUI」を
#   解消しpending store(src/stores/pending.ts)・client(src/api/client.tsのpending系)層を
#   条件化。実装前のため新条件のテストは実行failを許容(pnpm vitest runは実行可能)。
#   PendingView componentの実描画はvitest(node環境)で観測できないためexcluded維持
#   (P4のLoginViewと同一扱い)。一覧のUI状態はstoreのstatus別集計getter(counts)で担保し
#   scan実行はrunScan action(POST後に一覧再取得)で担保する。
#   GET /api/pending応答・POST /api/pending/scan応答の形式はserver.toml P5条件の解釈
#   ({"pending":[...]}・item schema共通)に整合。

