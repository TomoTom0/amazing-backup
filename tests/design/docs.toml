description = "docs usage・docs llm usage・docs llm skill・docs llm snippetは各正本(docs/usage_backup.md〔version行置換後〕・docs/llm/usage.md・docs/llm/skill.md・docs/llm/snippet.md)の内容をstdoutへそのまま(byte一致)出力し exit 0。行追加・装飾なし。設定に非依存(AMAZING_BACKUP_HOME空dirでも動作) (unit, integration)"
given = "AMAZING_BACKUP_HOMEを空dirへ固定した環境での各ページ実行(stdoutをunit側はWrite注入・integration側はbin subprocessで捕捉し、repo正本file読込との比較)"
expect_return_shape = "各ページ exit 0・stdout==正本(usageはversion置換後の内容)。stderrに設定・S3系の表示なし"
source_lines = "src/docs.rs:193; tests/docs_pages.rs:265"

[[condition]]
id = "docs.usage-version-substituted"
target_function = "docs::cmd_docs_pages(version行置換)"
source = "TASK-4 body + tmp/tasks/tm-4/design_docs_command.md 3.4(設計レビュー指摘2対応)"
description = "version行置換の検証は2層: (unit)変換関数へ正本と異なるversion literal(例: 9.9.9)を持つ合成入力を渡し、期待値はテスト側で独立に組み立てた文字列(実装の変換関数を使わない)とbyte比較する。検証点: `- 実装バージョン:`行が合成入力中ちょうど1行でその1行のみが置換される・対象行以外のbyteが一切変化しない・入力末尾の改行が保持される(正本literalとCARGO_PKG_VERSIONが一致する通常時は無変換出力でも置換検査を通るため、異なるversion入力による変換関数単独の検証が必須)。(integration)docs usage出力の「実装バージョン:」行の値がbinary自身のversion(clap --versionと同一source=CARGO_PKG_VERSION)と一致(正本から当該行が消えた・書式が変わって置換が作用しなくなったらfail) (unit, integration)"
given = "変換関数への合成入力(異なるversion literal・対象行1行・末尾改行付き)とunit期待値(テスト側で独立組み立て)。およびdocs usage実行の出力とテスト側の env!(\"CARGO_PKG_VERSION\")"
expect_return_shape = "unit: 変換出力==独立期待値(対象行のみ置換・他byte不変・末尾改行保持)。integration: 出力中の実装バージョン行が `実装バージョン: <CARGO_PKG_VERSION>` と一致"
source_lines = "tests/docs_pages.rs:143; tests/docs_pages.rs:300; tests/docs_pages.rs:85"

