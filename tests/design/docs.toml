[[condition]]
id = "docs.llm-usage-exit-code-table-consistent"
target_function = "docs::cmd_docs_pages(llm usage)とusage_backup.md終了コード表の一致"
source = "tmp/tasks/tm-4/design_docs_command.md 3.5(重複管理・設計レビュー指摘3対応)"
description = "docs/llm/usage.mdの終了コード一覧とdocs/usage_backup.md終了コード一覧の一致を次の全点で検証する: (1)各表のcode集合が固定の期待集合{0,1,2,3,4,5,64}と完全一致(集合比較のみでは2と4の意味交換や両表の抽出失敗(空集合同士)を通すため固定期待を置く) (2)各表からcode→区分(成功/内部エラー/設定・環境/対象/検証/転送/使用法)の対応を抽出し両doc間で一致(codeと区分の交換を検出) (3)同一表内の同一code重複行の拒否 (4)抽出が空集合(表の不在・形式変更)の拒否。検出対象は終了コード表の乖離のみで、fail-fast/keep-going・dry-run既定・--out必須など表以外の事実の文言乖離は本条件の対象外(update-docs運用) (unit)"
given = "両正本(include_str!埋め込み)から終了コード表のcode行・区分語を抽出する処理と、固定期待集合{0,1,2,3,4,5,64}"
expect_return = "両表とも code集合==固定期待集合・code→区分対応が両doc間で一致・重複code行なし・抽出非空"
source_lines = "tests/docs_pages.rs:217"

