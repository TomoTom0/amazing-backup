item = "registry喪失(索引はS3に残る)からの回復操作(manage index rebuildで索引をmanifest基準へ現状化したうえで重複実体の不要側をprune・手動deleteで回収)"
source = "tmp/tasks/tm-18/design_key-uuid-versioning.md 4.3(境界条件表 registry喪失行)"
reason = "運用手順(設計は回復手段を記載するが自動化しない)。registry喪失時に合流できず重複uuidを発行する許容挙動自体はcli.backup-push-registry-loss-new-uuidで条件化"
decided_at = "2026-10-22"
decided_by = "claude"
