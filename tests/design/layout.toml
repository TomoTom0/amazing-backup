# backup-remote テスト設計条件書(layout エリア)
# 出典: tmp/tasks/tm-10/design_s3_storage.md 1章(1.1〜1.4)・4.2・9章素案(TASK-10 S3ストレージ設計)
# 2026-10-14: TASK-10実装(Phase A)に先立つテスト先行の条件書(新設feature)。
#   src/layout.rs は設計8.1で新設されるmodule(key生成・分類解決・衝突検出の純関数群・unit test主対象)。
#   実装前のため条件に対応するテストコードは未作成(網羅検査は警告のみの段階)。
# 2026-10-22: TASK-18(S3キー設計: UUID+versioning)対応でテスト先行の更新
#   (tmp/tasks/tm-18/design_key-uuid-versioning.md 5.1・5.15・10章)。
#   廃止1件: layout.key-generation-collision-hash-suffix(folder衝突規則廃止・キー構造への影響が消滅)。
#   文言改訂6件(id不変): key-generation-* 3件はkey期待値を分類解決結果(category/rel_path=所在記録値)の
#   検証へ置換・rel-path-normalization(記録値正規化へ)・category-name-validation(files写像path先頭の
#   sys衝突検証廃止に伴う除去)・key-length-limit-1024(UUIDキー生成関数の境界検証へ)。
#   新規3件: uuid-v7-generation・data-area-object-keys・title-validation。
#   excludedへ旧キー形式からの移行copy(設計9章・本タスク範囲外)を追加。
#   実装前のため新規条件のテストは未作成・改訂期待値のテストは実行failを許容。

[meta]
feature = "layout"
source_file = "src/layout.rs"
verified = true
verified_at = "2026-10-22"
verified_by = "claude"
test_command = "cargo test"
source_hash = "9486f7b0560c46fe5dd9715f1df0c2005bf8d109"
note = "TASK-10(9章素案+設計1章本文)の条件化。TASK-18でキー構造がUUID体系(data/{uuid}/…・check_key_length継続)へ全面変更。classify/files写像/auto_path_rootsによる分類解決は維持前提(TASK-18設計5.1・5.15)で、category/rel_pathはIndexLocationの所在記録値として残る。prefix・category・pin名・titleの検証はconfig.rs(起動時設定検証)からも呼ばれる(検証関数の実体はlayout.rs)"

[[condition]]
id = "layout.uuid-v7-generation"
target_function = "layout::generate_uuid"
source = "tmp/tasks/tm-18/design_key-uuid-versioning.md 5.1(generate_uuid)・10章(layout)"
description = "generate_uuidはUUIDv7のhyphenated lowercase 36文字列を返す(version nibble=7・時刻由来の単調増加傾向: 連続呼び出しで辞書順が逆転しない) (unit)"
given = "generate_uuidを連続3回呼び出し"
expect_return_shape = "いずれも36字のhyphenated lowercase UUID形式(8-4-4-4-12)でversion部が7。連続呼び出しの辞書順は呼び出し順と一致(単調増加)"
source_lines = "src/layout.rs:334; tests/layout.rs:360"

[[condition]]
id = "layout.data-area-object-keys"
target_function = "layout::data_object_key / layout::pin_object_key / layout::metadata_object_key"
