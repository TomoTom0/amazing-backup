description = "実体領域のkey生成: data_object_key={prefix}data/{uuid}/default.age・pin_object_key={prefix}data/{uuid}/{pin}.age(引数を(category,rel_path,folder,pin)から(uuid,pin)へ替える)・metadata_object_key={prefix}data/{uuid}/metadata_{title}.json。prefixはaws.tomlのprofile値をそのまま連結(data/・sys/はRESERVE_SEGMENT体系・pin名の検証は呼び出し側で実施済み) (unit)"
given = "prefix=backup-remote/・uuid=0192a4f0-3c1b-7a2e-9f10-112233445566・pin=keep-1・title=旅のしおり2026"
expect_return = "backup-remote/data/0192a4f0-3c1b-7a2e-9f10-112233445566/default.age と backup-remote/data/0192a4f0-3c1b-7a2e-9f10-112233445566/keep-1.age と backup-remote/data/0192a4f0-3c1b-7a2e-9f10-112233445566/metadata_旅のしおり2026.json"
source_lines = "src/layout.rs:359; tests/layout.rs:421"

