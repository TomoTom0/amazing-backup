description = "使用法誤り(引数誤り)は exit 64(clapのusage error既定 exit 2 を BackupError::Usage へremapし、設定エラー2と区別する) (unit)"
given = "不明オプション・サブコマンド不足等のusage誤り実行"
expect_return = "exit code 64"
source_lines = "src/cli.rs:1100"

