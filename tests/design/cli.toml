[[condition]]
id = "cli.date-format-usage-error"
target_function = "clap定義(UploadArgs.date / VerifyArgs.date のvalue_parser)"
source = "tmp/tasks/tm-1/design_backup_pipeline.md 8章 CLI-006(2026-10-09レビュー指摘対応。2.3・2.4)"
description = "upload / verify の--dateはYYYY-MM-DD形式(半角数字4-2-2)を検証し、形式不正はusage error 64(誤記が対象なしexit 0で静かな未upload/未検験になるのを防ぐ。暦日としての実在性は検証しない) (unit)"
