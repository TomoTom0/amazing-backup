expect_return = "形式不正は exit 64。形式どおりはusage errorとならず次段(設定読込等)へ進む"
source_lines = "src/cli.rs:1522"

[[condition]]
id = "cli.profile-option-removed"
target_function = "clap定義(UploadArgs / RestoreArgs系) / config::load_aws"
source = "TASK-9 SDK移行設計 3.7・9.1(tmp/tasks/tm-9/design_sdk_migration.md 3章・9章)。10.2新規条件"
description = "--profile廃止: CLI --profile(upload/restore全系)は未知オプション扱いのusage error 64となる(定義削除)。--helpの文言に--profileが現れない。--region/--bucket/--storage-class/--aws-configは維持される。aws.tomlのprofileキー残存はdeny_unknown_fieldsで設定エラー2(pre-productionのためbreaking変更可) (integration)"
given = "upload --profile x・restore request --profile x実行。upload --help実行。profileキー入りaws.tomlでのupload実行"
expect_return_shape = "--profile指定は exit 64。--helpに--profileを含まず--region/--bucketを含む。aws.tomlのprofile残存は exit 2"
source_lines = "tests/s3_backend.rs:127"

[[condition]]
id = "cli.fake-s3-seam"
target_function = "cli::select_backend(FakeS3 seam選択)"
source = "TASK-9 SDK移行設計 4.3案1・10.3・12.4(tmp/tasks/tm-9/design_sdk_migration.md 4章・12章)。10.2新規条件"
description = "fake seam: env BACKUP_REMOTE_FAKE_S3_STATE=<dir>指定時はS3 backendをfakeへ差し替える(gateは#[cfg(debug_assertions)]でrelease build・debug_assertions無効にはseam・FakeS3ともcompileされず実S3経路になる)。fakeはstate dir配下へobjects/<key>とcalls.log相当のAPI呼び出し記録(op名・bucket・key・storage_class・checksum・days・tier等のfield)を書く。fake選択時はstderr冒頭へ「WARNING: FAKE S3 MODE」を必ず表示する(誤用防御)。fakeはcredential値が不正(検出用ダミー値)でも成功する=実network不使用 (integration, fake seam)"
given = "BACKUP_REMOTE_FAKE_S3_STATEを設定したupload実行(state dirを用意・credentialファイルはダミー値)"
expect_return_shape = "exit 0でstate dirへobjects/<key>と呼び出し記録が書かれ、stderr冒頭にWARNING: FAKE S3 MODE表示。credential値・検出用ダミーは出力に現れない"
source_lines = "src/s3.rs:739; src/s3.rs:779; tests/s3_backend.rs:101"

