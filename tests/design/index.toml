# backup-remote テスト設計条件書(index エリア)
# 出典: tmp/tasks/tm-10/design_s3_storage.md 2章(2.1〜2.4)・1.4・8.1・9章素案(TASK-10 S3ストレージ設計)
# 2026-10-14: TASK-10実装(Phase A)に先立つテスト先行の条件書(新設feature)。
#   src/index.rs は設計8.1で新設されるmodule(索引構築(registry reduceから)・直列化・検索・
#   完全性突合の中核=query/list/diffのmodel層)。
#   実装前のため条件に対応するテストコードは未作成(網羅検査は警告のみの段階)。
# 2026-10-15: TASK-11(Phase B低残件)対応でテスト先行の更新(TASK-11 body):
#   新規2件追加: index.version-ts-from-file-write(version_ts時刻源=暗号化時刻(file_write記録時刻))・
#   index.unknown-record-warning-plain-format(L-5: 索引parseの未知record_type警告の表示形式)。
#   実装前のため新条件のテストは実行failを許容し[meta]はverified=falseのまま。
# 2026-10-15: TASK-11(Phase B)コードレビュー指摘対応(L-6)でテスト先行の更新。
#   新規1件: index.parse-failure-guides-rebuild(索引parse失敗時のerror文にmanage index rebuild案内)。
# 2026-10-15: TASK-11(Phase B)再レビュー指摘対応(M-R1・L-R1)でテスト先行の更新。
#   新規2件: index.pins-bucket-isolated(索引pins[]構築・復元のbucket一致=M-R1)・
#   index.entries-without-bucket-versions-excluded(当該bucketの版もpinも無いentryの索引載せ除外=L-R1)。
# 2026-10-19: TASK-12(pin rm後の同一pin名再付与が索引へ反映されない)でテスト先行の更新。
#   新規1件: index.pin-readd-after-remove-wins(pin rm→同一pin名再addでrecorded_atが新しい
#   pin_writeが旧pin_removeに抑止されず勝ち、索引pins[]へ反映されlist pins/get --pinで参照できる。
#   manage index rebuildのpins復元も同一reduce結果を参照するため共通)。
#   「rmしたきり再addしない場合の排除」は既存index.pin-entriesのrm側期待値が担保済みのため
#   excludedへ整理(重複追加せず)。実装(src/registry.rs reduce)後にcargo test全件pass・
#   verify-conditions.py PASS。
# 2026-10-19: TASK-15(同一prefix・別bucket構成で同一fileへ同名pinを複数bucketへ付与すると
#   先付けbucket側の索引からpinが消える)でテスト先行の更新。新規2件:
#   index.pins-multi-bucket-same-name-kept(reduceのpin_writes/pin_removesのmap keyが
#   (pin_s3_key, s3_bucket)組であることで同名pinの複数bucket付与でも両bucketの索引pins[]
#   にそれぞれ載る。pin_s3_key単位HashMap(後勝ち)の上書きによるpin_write記録喪失の回帰)・
#   index.pin-rm-multi-bucket-independent(両bucket付与状態でのpin rmがbucket単位で独立して
#   可能・他方bucketの索引・pin objectは不変)。「write-once trap解消の新規条件化」
#   「bucket軸×時間軸(rm→再add)の複合条件」はexcludedへ整理。実装(src/registry.rs
#   reduceの組key化・src/index.rs・src/storage/manage.rsの照合対応)後にcargo test全件pass・
#   verify-conditions.py PASS。

[meta]
feature = "index"
source_file = "src/index.rs"
verified = false
test_command = "cargo test"
note = "TASK-10(9章素案+設計2章本文)の条件化。索引は sys/index.jsonl.age(単一累積・run毎書換・versioning対象・STORAGE CLASS STANDARD)。索引PUTの実体はsrc/uploader.rs、災害時運用の前提は設計2.4。rebuild-from-registry-per-run等のrun経由条件はbackup push(7.3の新record_type経路)で検証する"

[[condition]]
id = "index.schema-and-serialization"
target_function = "index::(直列化/parse)"
source = "tmp/tasks/tm-10/design_s3_storage.md 2.1(schema)"
description = "索引JSONL(暗号化前の平文)schema: index_header(schema=1・record_type=index_header・updated_at ISO8601 JST・run_id・tool_version・entries=N)+file entry(record_type=file・name・category・rel_path・source_path・identity_hash・versions[]・pins[])。versionsはdate降順(先頭=最新)で各versionはdate(表示・--version日付filter用)・version_ts(同一日内複数版の一意化)・batch_id・s3_key(実keyをそのまま記録・規約から導出しない・衝突hash付きkeyもそのまま)・version_id・source_sha256・age_sha256・source_size・age_size。pins[]はpin・s3_key・created_at・date・source_sha256・age_sha256・source_size。identity_hash=sha256(realpath)先頭8hex(衝突folder名と同一・source_pathが変わればidentityも変わる)。直列化→parseの往復で全fieldが保たれる (unit)"
given = "2 file entry(うち1 fileにversion 2件・pin 1件)を含む索引構造の直列化→parse"
expect_return_shape = "headerのentries=Nがfile entry数と一致し、versionsはdate降順に保たれ、全fieldが往復で失われずparse結果が構築時と等価"
source_lines = "src/index.rs:462; tests/index_storage.rs:65"

