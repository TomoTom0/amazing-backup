[[condition]]
id = "index.parse-failure-guides-rebuild"
target_function = "index::parse_index(schema違反時の案内)"
source = "TASK-11(Phase B)コードレビュー指摘L-6+tmp/tasks/tm-10/design_s3_storage.md 2.3(喪失時再構築)"
description = "索引parse失敗(不正JSON行・index_header/file entryのschema違反・index_header不在)のerror文には`manage index rebuild`による索引再構築の案内を含める(終了コードは検証エラー4のまま変更しない。索引objectが壊れている場合の回復経路を利用者へ示す) (integration, fake seam)"
given = "索引objectをschema違反の平文(file entry必須field欠損)へ書き換えた状態での list files 実行"
