given = "manifestがN件(DEEP_ARCHIVE未復元)で索引objectが不在のfake S3での manage index rebuild 実行・再実行(進行中)、およびversion_id欠損manifestを混ぜた実行"
expect_return_shape = "未復元manifestへBulkの復元jobが発行され(再実行で継続)、全manifestからentryが再構築されs3_key・version_idはmanifest記録値(欠損分はListObjectVersionsで補完)で、sys/index.jsonl.ageへPUTされ、開始時にtier別の費用・所要概算表示が出る"
