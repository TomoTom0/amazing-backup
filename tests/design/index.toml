description = "file_write記録にs3_bucket字段が無いためentry組立はbucket不関だが、索引の意味論は「当該namespace(bucket)で管理されるfile」: 当該実効bucketと一致するfile_upload記録によるversions[]もbucket一致するpin_write記録によるpins[]も持たないentry(同一prefix・別bucket構成で他方bucketにしかuploadされていないfile等)は索引entriesへ載せない(list/query/diffの表示・getのname解決から除外。版が無いentryがgetで版なしエラーになる表示面の混入を防ぐ。データ破壊は無い) (integration, fake seam)"
given = "dev(active_profile)とprodが同一prefix・別bucketのaws.toml構成でa.zipを両bucketへ・b.zipをdevのみへpushした状態での、prod側(--profile)からの list files・query・get・diff の各実行と、dev側(正本bucket)での list files 実行"
expect_return_shape = "prod側はいずれもa.zipのみが現れb.zipは現れない(list files表示・query一致・getはname不在の対象エラー3・diffのentries数)。dev側は従来どおりa.zip・b.zip双方が現れる"
source_lines = "src/index.rs:615; tests/phase_b_options.rs:596"

[[condition]]
id = "index.pin-readd-after-remove-wins"
target_function = "registry::reduce_records(pin_write/pin_remove) / index::build_entries / manage index rebuild(pins復元)"
source = "TASK-12 body(pin rm後の同一pin名再付与が索引へ反映されない・write-once案内の正規フロー)+tmp/tasks/tm-10/design_s3_storage.md 1.3(write-once: 上書きしたい場合はpin rm後に再付与)・2.2(索引に影響する操作後の再構築)・2.3(pins復元)"
description = "write-onceの正規フロー「pin rm後に再付与」(設計1.3)が索引経由の参照でも成立すること: registryの記録順処理で、pin rm→同一pin名の再addではrmよりrecorded_atが新しい再付与のpin_writeが旧pin_removeに抑止されず勝つ(reduce結果のpin_removesから当該pin_s3_keyが除かれる。bucket一致規則はindex.pins-bucket-isolatedのままで本条件と直交)。従来はpin_writes/pin_removesが独立mapのためrm→再addでも削除済み扱いが残り、索引pins[]から消えたままget --pin/list pins/pin rm再実行が不能になっていた(TASK-12)。manage index rebuildのpins復元も同一reduce結果を参照するため共通して直る (integration, fake seam)"
given = "backup push→pin add(pm1)→pin rm(pm1)→同一pin名pm1の再付与(pin add)後の索引再構築と list pins・get --pin pm1 の各実行、および索引object削除後の manage index rebuild 実行"
expect_return_shape = "再付与後の索引当該entry pins[]にpm1が載り(created_atは再付与のpin_write記録時刻)、list pinsにpm1が現れget --pin pm1はexit 0でpin objectを取得できる。manage index rebuild復元後の索引pins[]にもpm1が含まれる"
source_lines = "tests/index_storage.rs:803"

[[condition]]
id = "index.pins-multi-bucket-same-name-kept"
target_function = "registry::reduce_records(pin_writes/pin_removes) / index::build_entries / manage index rebuild(pins復元)"
source = "TASK-15 body(別bucket同名pin付与で先付けbucket側の索引からpinが消える・設計4.2 231行のbucket分離期待の逆方向を破る)+tmp/tasks/tm-10/design_s3_storage.md 4.2(混同防止: 索引構築versions/pinsもbucket一致分離)・2.3(pins復元)"
description = "索引pins[]構築のbucket分離は「他bucketのpin記録が混入しない」(index.pins-bucket-isolated)とともに「当方bucketのpin記録が他bucketの同名pin_writeで失われない」方向も含む: reduceのpin_writes/pin_removesのmap keyは(pin_s3_key, s3_bucket)組で、同一prefix・別bucket構成で同一fileへ同名pinを複数bucketへ付与しても、後bucketのpin_writeが先bucketのmap entryを上書きせず両bucketの索引pins[]にそれぞれのpinが載る(get --pin・list pinsで参照可能)。従来はpin_s3_key単位のHashMap(後勝ち単一entry)のため後bucketのwriteが先bucketのentryを上書きし、先付けbucket側の索引からpinが消えていた(pin_write記録がreduce結果から喪失するためbuild_entriesのbucket一致判定でも救えず、manage index rebuildでも回復しない=記録喪失。TASK-15) (integration, fake seam)"
given = "dev(active_profile)とprodが同一prefix・別bucketのaws.toml構成でa.zipを両bucketへpushし、同一pin名pm1をdev(先付け)・prod(後付け)の順で両bucketへ付与した状態での、(1)prod側push(all-skip)後に再構築されたprod側索引と、dev側索引再構築(all-skip push)・list pins・get --pin pm1(dev・prod各profile)の各実行 (2)dev側索引object削除後の manage index rebuild 実行"
expect_return_shape = "(1)dev側索引の当該entry pins[]にpm1(devのpin_write記録由来)が載り、prod側索引の当該entry pins[]にもpm1(prodのpin_write記録由来)が載る(created_atは各bucketの付与時刻。いずれも片側にのみ載る片寄りがない)。いずれのprofileでも list pins にpm1が現れ get --pin pm1 はexit 0で当該bucketのpin objectを取得できる (2)rebuild復元後のdev側索引pins[]にもpm1が含まれる"
source_lines = "tests/index_storage.rs:1026"

[[condition]]
id = "index.pin-rm-multi-bucket-independent"
target_function = "pin rm(索引pins[]参照・pin object削除) / index::build_entries"
source = "TASK-15 body(goal: 各bucketの索引からそれぞれのpinが消えず参照できること(pin rmも可能))+tmp/tasks/tm-10/design_s3_storage.md 4.2(混同防止: pin解決も当該実効bucketの索引に限る)"
description = "同一file・同名pinを複数bucketへ付与した状態でのpin rmはbucket単位で独立して可能: 各bucketでの実行は当該bucketの索引pins[](当該bucketのpin_write記録由来)を参照してpin objectを削除・索引から除去し、他方bucketの索引pins[]・pin objectは不変(他方bucketで同名pinが引き続き参照できる)。従来は先付けbucket側の索引からpinが消えるため、当該bucketでpin rm不能(索引に無くpin名不在の対象エラー3)かつpin add不能(write-onceのhead検出で既存pin keyへのPUT拒否)のtrapになっていた(TASK-15 goalの「pin rmも可能」) (integration, fake seam)"
given = "同一fileへ両bucketに同名pin(pm1)を付与した状態(index.pins-multi-bucket-same-name-keptのgivenと同一構成)での、(1)dev側(先付けbucket=従来索引から消えていた側)での pin rm --pin pm1 実行 (2)その後のprod側 get --pin pm1 --profile prod と pin rm --pin pm1 --profile prod の各実行"
expect_return_shape = "(1)dev側pin rmはexit 0(索引pins[]に載っているためpin名不在の対象エラー3にならない)で、dev側索引pins[]からpm1が除かれdev bucketのpin objectも削除される (2)prod側索引pins[]はpm1を保持し(pin object不変) get --pin pm1 はexit 0。続くprod側 pin rm もexit 0でprod側索引から除去される。一方のbucketでの実行が他方bucketの索引pins[]・pin objectへ影響しない"
source_lines = "tests/index_storage.rs:1144"

[[excluded]]
