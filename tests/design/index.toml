source = "TASK-15 body(修正案: map keyを(pin_s3_key, s3_bucket)組へ変更)+TASK-12 body(pin rm後の同一pin名再付与)"
reason = "bucket軸の独立(今回のindex.pins-multi-bucket-same-name-kept・index.pin-rm-multi-bucket-independent)と時間軸の再付与勝ち(index.pin-readd-after-remove-wins)は直交する要件で、組key化しても時間軸処理(同一組keyのpin_remove除去)はbucket内で完結するため、各軸を単独条件で担保すれば複合の帰結は定まる。複合条件は組合せ数を増やすだけで新たな分岐を検証しないため追加しない"
decided_at = "2026-10-19"
decided_by = "claude"

