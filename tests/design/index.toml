[[condition]]
id = "index.schema-and-serialization"
target_function = "index::(直列化/parse)"
source = "tmp/tasks/tm-10/design_s3_storage.md 2.1(schema)。TASK-18(tmp/tasks/tm-18/design_key-uuid-versioning.md 3.1(索引schema 1→2・IndexLocation新設)・5.4): 実体単位entry(entity)構造へ改訂"
description = "索引JSONL(暗号化前の平文)schema=2: index_header(schema=2・record_type=index_header・updated_at ISO8601 JST・run_id・tool_version・entries=N)+file entry(record_type=file維持・実体単位: uuid・title・versions[]・pins[]・locations[])。versionsはdate降順(先頭=最新)で各versionのfield構成は不変(date・version_ts・batch_id・s3_key=data/{uuid}/default.age記録値・version_id・source_sha256・age_sha256・source_size・age_size)。pins[]のfield構成も不変。IndexLocation(新設): source_path(realpath絶対path・記録表現のまま)・category(分類解決結果の記録値)・rel_path(正規化済み・空=なし)・identity_hash(sha256(realpath)先頭8hex・所在の突合キー)・last_backup(YYYY-MM-DD・その所在の最終backup日)。locationsの並びはsource_path辞書順(冪等担保)。旧entryのname/category/rel_path/source_path/identity_hashはlocationsへ移行・folderは廃止。直列化→parseの往復で全fieldが保たれる (unit)"
given = "2 entity(うち1 entityにversion 2件・pin 1件・location 2件)を含む索引構造の直列化→parse"
expect_return_shape = "headerのentries=Nがentity数と一致し、versionsはdate降順・locationsはsource_path辞書順に保たれ、全fieldが往復で失われずparse結果が構築時と等価"
source_lines = "src/index.rs:493; tests/index_storage.rs:103"

