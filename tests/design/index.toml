[[condition]]
id = "index.prune-versions-not-revived-on-rebuild"
target_function = "index::build_entries"
source = "tmp/tasks/tm-10/design_s3_storage.md 2.2(索引の再構築)・レビューH-1"
description = "manage prune --apply済みの版(s3_key+version_id)は、その後のbackup push等での索引再構築で復活しない(削除記録PruneDeleted集合で除外)。get --version-idで削除済み版は選べない(対象エラー3) (integration, fake seam)"
given = "3版push→prune --apply --keep 1(最古版削除)→内容変更の再push"
expect_return_shape = "再push後の索引versionsに削除済みversion_idが含まれず、get --version-id <削除版>はexit 3"
source_lines = "tests/retention.rs:288"

[[condition]]
id = "index.rebuild-preserves-folder-and-pins"
target_function = "manage index rebuild"
source = "tmp/tasks/tm-10/design_s3_storage.md 2.3(manifestからの再構築)・レビューH-3"
description = "manage index rebuildはmanifest V2のfolder記録を使用し(entry.folderを落とさない)、ローカルregistryのpin_write記録(未削除)からpins[]を復元する。rebuild後のpin addは正しいpin key(<category>/<rel_path>/<folder>/<pin>.age)へ写る (integration, fake seam)"
given = "push+pin add(pm1)→索引object削除→manage index rebuild→pin add(pm2)"
expect_return_shape = "rebuild後の索引entryはfolder保持かつpinsにpm1を含み、pm2のpin addが正規pin keyへ成功しpinsは2件"
source_lines = "tests/index_storage.rs:607"
