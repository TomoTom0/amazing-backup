[[condition]]
id = "retention.lifecycle-data-ncve-and-sweep-rules"
target_function = "manage lifecycle apply(lifecycle構成生成) / s3 put_lifecycle"
source = "tmp/tasks/tm-18/design_key-uuid-versioning.md 7章(lifecycle設定詳細)・5.12・6.4・10章(manage)"
description = "lifecycleはdata/一括の3rule構成(値はすべてconfigs/aws.toml [aws.lifecycle]から・ハードコード禁止・承認事項7): 1) data-ncve: Filter Prefix={prefix}data/・NoncurrentVersionExpiration{NoncurrentDays=noncurrent_days, NewerNoncurrentVersions=keep_versions}(最新10版+現行を保持・Deep Archive最低保存180日との整合) 2) mpu-abort: Filter Prefix={prefix}・AbortIncompleteMultipartUpload{DaysAfterInitiation=mpu_abort_days} 3) delete-marker-sweep: Filter Prefix={prefix}data/・Expiration{ExpiredObjectDeleteMarker=true}(title変更時の旧metadataキーdelete marker・metadata非現行版の掃除)。category毎ruleは廃止。sys/は{prefix}data/外のためNCVE対象外(現行どおり)。applyはput-bucket-lifecycle-configurationでrule一式を置換(冪等) (integration, fake seam)"
given = "[aws.lifecycle]{noncurrent_days=180, keep_versions=10, mpu_abort_days=7}での manage lifecycle apply 実行と、同コマンドの再実行"
expect_return_shape = "PutBucketLifecycleConfigurationのrule一式に上記3rule(prefix・NoncurrentDays・NewerNoncurrentVersions・DaysAfterInitiation・ExpiredObjectDeleteMarkerの各値はaws.toml値)が含まれ、category毎ruleは含まれず、再実行は同一構成を置換する(冪等)"
source_lines = "tests/retention.rs:334"

