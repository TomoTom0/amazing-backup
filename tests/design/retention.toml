given = "push済み(data object・索引・manifest・metadata)かつdelete marker 1件が存在し、registryは当該bucket(dev)の記録のみの状態での manage reset --apply 実行(退避先がcwd基準のため専用作業dirで実行)"
expect_return_shape = "exit 0で、bucket名入りの退避file名で退避fileが退避時点のregistryと同一内容(全体copy)として作成され、全version(delete marker含む)がDeleteObjectVersionで削除され、再list_versions 0件の確認表示が出て、registry.jsonlが削除される(温存対象なしのため残0行→file削除)"
source_lines = "tests/retention.rs:1166"

[[condition]]
id = "retention.reset-idempotent"
target_function = "cli::cmd_manage_reset(冪等性)"
source = "tmp/tasks/tm-18/design_key-uuid-versioning.md 8章(8.1コマンド仕様)・5.12(manage)。TASK-25(tmp/tasks/tm-25/design_reset_bucket_scoped.md 5章・1.3・2.3): 除去対象0件かつtorn tail無しの書換なし原則を追記"
description = "manage resetは冪等: 空状態への再実行(registry不在のため退避skip・0件削除)も成功する。registryが存在する状態での再実行は、除去対象0件かつtorn tail無しならregistry書換なし(torn tailがあれば除去0件でも再書込してtail破棄。tail放置は後続appendの未完行連結=registry破損要因)。途中失敗時は再実行で残りを削除 (integration, fake seam)"
given = "manage reset --apply実行済みの空状態(S3 version 0件・ローカルregistry不在)での再実行"
expect_return_shape = "exit 0で、registry退避はskip表示・削除対象0件・再list_versions 0件の確認表示が出て、新たな退避fileは作られない"
source_lines = "tests/retention.rs:1228"

[[condition]]
id = "retention.reset-registry-preserves-other-bucket-records"
target_function = "cli::cmd_manage_reset(registry再書込) / registry partition_reset_removal(除去判定)"
