[meta]
feature = "retention"
source_file = "src/cli.rs"
verified = true
verified_at = "2026-10-22"
verified_by = "claude"
test_command = "cargo test"
source_hash = "8b520f49e8b55d87c115f5f5c1a68f40f6bc6d85"
note = "TASK-10(9章素案+設計3.2/5.2本文)の条件化。TASK-18で保持数管理がaws.toml [aws.lifecycle](noncurrent_days・keep_versions・mpu_abort_days)へ一元化(ハードコード禁止・承認事項7)し、lifecycleはdata/一括3rule(NCVE+MPU abort+DeleteMarkerSweep)、pruneはdata/一括(keep=aws.toml値)。source_fileはエリア主対象としてcli.rs(manage系コマンド)を指し、lifecycle構成のS3 API実体(src/s3.rs)と対象計算(src/index.rs)はtarget_functionで特定(config.tomlのCONF-005と同一運用)"

[[condition]]
id = "retention.lifecycle-data-ncve-and-sweep-rules"
target_function = "manage lifecycle apply(lifecycle構成生成) / s3 put_lifecycle"
source = "tmp/tasks/tm-18/design_key-uuid-versioning.md 7章(lifecycle設定詳細)・5.12・6.4・10章(manage)"
description = "lifecycleはdata/一括の3rule構成(値はすべてconfigs/aws.toml [aws.lifecycle]から・ハードコード禁止・承認事項7): 1) data-ncve: Filter Prefix={prefix}data/・NoncurrentVersionExpiration{NoncurrentDays=noncurrent_days, NewerNoncurrentVersions=keep_versions}(最新10版+現行を保持・Deep Archive最低保存180日との整合) 2) mpu-abort: Filter Prefix={prefix}・AbortIncompleteMultipartUpload{DaysAfterInitiation=mpu_abort_days} 3) delete-marker-sweep: Filter Prefix={prefix}data/・Expiration{ExpiredObjectDeleteMarker=true}(title変更時の旧metadataキーdelete marker・metadata非現行版の掃除)。category毎ruleは廃止。sys/は{prefix}data/外のためNCVE対象外(現行どおり)。applyはput-bucket-lifecycle-configurationでrule一式を置換(冪等) (integration, fake seam)"
given = "[aws.lifecycle]{noncurrent_days=180, keep_versions=10, mpu_abort_days=7}での manage lifecycle apply 実行と、同コマンドの再実行"
expect_return_shape = "PutBucketLifecycleConfigurationのrule一式に上記3rule(prefix・NoncurrentDays・NewerNoncurrentVersions・DaysAfterInitiation・ExpiredObjectDeleteMarkerの各値はaws.toml値)が含まれ、category毎ruleは含まれず、再実行は同一構成を置換する(冪等)"
source_lines = "tests/retention.rs:334"

[[condition]]
id = "retention.mpu-abort-rule"
target_function = "manage lifecycle apply(lifecycle構成生成)"
source = "tmp/tasks/tm-10/design_s3_storage.md 5.2(MPU abort rule)。TASK-18(tmp/tasks/tm-18/design_key-uuid-versioning.md 7章): 日数をaws.toml [aws.lifecycle] mpu_abort_days値へ改訂(ハードコード廃止)"
description = "MPU abort rule(prefix <prefix>/): AbortIncompleteMultipartUploadの日数はaws.toml [aws.lifecycle]のmpu_abort_days値(本ツールが設定管理・コード内defaultなし) (integration, fake seam)"
given = "[aws.lifecycle] mpu_abort_days=7のaws.tomlでの manage lifecycle apply 実行"
expect_return_shape = "lifecycle構成に AbortIncompleteMultipartUpload(日数=mpu_abort_days値)・prefix=<prefix>/ のruleが含まれる"
source_lines = "tests/retention.rs:97"

[[condition]]
id = "retention.prune-dry-run-default"
target_function = "cli::cmd_manage_prune"
source = "tmp/tasks/tm-10/design_s3_storage.md 3.2(manage prune)。TASK-18(tmp/tasks/tm-18/design_key-uuid-versioning.md 5.12・6.5): pruneのdata/一括化に伴い改訂"
description = "pruneは--dry-runが既定: --applyなき実行は削除を行わず、ListObjectVersions({prefix}data/配下一括)から計算した削除対象を報告して exit 0 (integration, fake seam)"
given = "削除対象が存在する状態での、--dry-run明示とオプション省略の manage prune 実行"
expect_return_shape = "いずれもDeleteObjectVersionは呼ばれず、削除対象の報告表示が出て exit 0"
source_lines = "tests/retention.rs:133"

[[condition]]
id = "retention.prune-protects-current-and-pins"
target_function = "cli::cmd_manage_prune(対象計算)"
source = "tmp/tasks/tm-10/design_s3_storage.md 3.2(manage prune)"
description = "pruneの対象計算では現行version・pin key(<pin名>.age)は対象外(構造的保護。data/一括でも`/default.age`終端のみが対象のためmetadata_{title}.jsonも対象外) (integration, fake seam)"
given = "現行versionとpin objectとmetadata objectが存在するkeyを含む状態での manage prune --apply 実行"
expect_return_shape = "現行version・pin key・metadata keyへの削除は行われず、default.ageのnoncurrent版のみが削除対象となる"
source_lines = "tests/retention.rs:177"

[[condition]]
id = "retention.prune-apply-deletes-versions"
target_function = "cli::cmd_manage_prune(削除条件式)"
source = "tmp/tasks/tm-10/design_s3_storage.md 3.2・5.2(削除条件の単一定義・11章S3-4)。TASK-18(tmp/tasks/tm-18/design_key-uuid-versioning.md 5.12・6.5): --keep廃止・keep値のaws.toml [aws.lifecycle] keep_versions一元化へ改訂"
description = "削除条件(NCVEとprune共通の単一定義): 削除対象=同一keyのnoncurrent版を新しい順に並べたとき、newer noncurrent版の数がkeep以上となった版(境界=ちょうどkeep番目に新しいnoncurrent版は残す)。keep値はaws.toml [aws.lifecycle] keep_versions(--keepオプションは廃止・当該実行での上書きは不可)。--apply時はDeleteObjectVersion (integration, fake seam)"
given = "同一keyにnoncurrent版6件ある状態で、keep_versions=5のaws.tomlでの--apply実行"
expect_return_shape = "keep=5では最古の1件のみ(newer noncurrent数5以上)削除され境界(5番目に新しいnoncurrent版)は残る。削除はDeleteObjectVersionで行われる"
source_lines = "tests/retention.rs:227"

[[condition]]
id = "retention.prune-dry-run-apply-exclusive"
target_function = "cli::cmd_manage_prune(実行mode検査)"
source = "tmp/tasks/tm-10/design_s3_storage.md 12章レビューL-8(Phase A実装済み・事後条件化)"
description = "manage pruneの--dry-runと--applyは併置不可: 両方指定した場合はusage error 64(dry-runが既定のため併置は指定として矛盾する。対象計算の前に判定される) (integration, fake seam)"
given = "manage prune --dry-run --apply 実行"
expect_return_shape = "exit 64で、S3 API呼び出し(ListObjectVersions)は行われない"
source_lines = "tests/retention.rs:447"

[[condition]]
id = "retention.prune-partial-failure-records-deleted"
target_function = "cli::cmd_manage_prune(削除loopの記録)"
source = "TASK-11(Phase B)コードレビュー指摘L-2+tmp/tasks/tm-10/design_s3_storage.md 3.2(manage prune)・2.2(索引の再構築)"
description = "prune --applyの削除loopは削除成功分をその都度PruneRecordへ記録する(削除完了後の一括記録だと、loop途中の失敗で中断した場合に削除済み版が記録に載らず、以降の索引再構築で幽霊版が復活しうるため)。途中失敗した場合もそれまでの削除成功分の記録は残り、冪等な再実行で残対象の削除・記録が継続される (integration, fake seam)"
given = "同一keyにnoncurrent版複数(削除対象3版)のある状態で、2版目のDeleteObjectVersionから失敗する注入(FAKE_S3_FAIL_DELVER_FOR)での manage prune --apply 実行と、注入なしの再実行"
expect_return_shape = "初回は転送エラー5で中断するが、registryのPruneRecordに削除成功済みの1版が記録されている。再実行はexit 0で残りの版を削除・記録し、索引再構築後に削除済み版がversionsへ復活しない"
source_lines = "tests/retention.rs:495"

[[condition]]
id = "retention.prune-order-uses-epoch"
target_function = "cli::cmd_manage_prune(版順sort)"
source = "TASK-11(Phase B)コードレビュー指摘L-4+tmp/tasks/tm-10/design_s3_storage.md 3.2(newer noncurrent数の定義)"
description = "pruneの対象計算における同一key内の版順sort(新しい順)はVersionInfo.last_modified_epochの数値比較で行う(文字列last_modified比較は表記形式混在(RFC3339のtimezone表記差等)で順序が崩れるため)。newer noncurrent数の数え上げ・現行version判定は実時刻順に正しく行われる (integration, fake seam)"
given = "noncurrent 2版のlast_modifiedを文字列辞書順と実時刻が逆転する組(timezone表記違い)へ書き換えたversions stateでの manage prune --apply --keep 1 相当(keep_versions=1)実行"
expect_return_shape = "実時刻で古い版(辞書順では新しい方)が削除対象となり、実時刻で新しい版は残る(削除DeleteObjectVersionのversion_idが実時刻順の期待と一致)"
source_lines = "tests/retention.rs:560"

