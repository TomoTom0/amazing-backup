description = "混在registryでのdev reset --applyは、当該bucket由来行(upload系記録(file_upload/manifest/index_upload/pin_write/pin_remove・旧upload/manifest_upload)+対象bucketのみにuploadされたuuidのfile_write)のみ除去して再書込(temp+fsync+rename+rename後の親dir fsync・残0行ならregistry file削除)し、他bucket宛行・共有uuidのfile_write(非対象bucketにもuploadされたuuid・prod側所在情報)・crash残存file_write(対応upload無しuuid)・prune/sweep/location_remove・旧encrypt・未知record_type行は温存する(行順保持。未知行もload_registryの「未知は警告のうえ無視」を書換では温存として再現)。退避はfs::copyによる全体copy(証跡完全) (integration, fake seam)"
given = "dev bucket宛のpush記録に加え、registryへ他bucket宛file_upload(s3_bucket=prod系)+そのuuidのfile_write・共有uuidのfile_upload(dev bucket宛・prodのfile_uploadと同一uuid)+同uuidのfile_write・crash残存file_write(対応upload無しuuid)・prune/sweep/location_remove・旧encrypt・未知record_type行を混在させた状態での manage reset --apply 実行"
expect_return_shape = "exit 0で、退避fileは追記込みのregistry全体copyと同一内容。再書込後のregistryはdev由来行(当該uuidのfile_write/file_upload・manifest/index_upload)のみが除去され、prod file_upload+紐付けfile_write・共有uuidのfile_uploadとfile_write・crash残存file_write・prune/sweep/location_remove/encrypt・未知record_type行は温存される(行順保持)"
source_lines = "tests/retention.rs:869"

[[condition]]
id = "retention.reset-registry-rewrite-idempotent"
target_function = "cli::cmd_manage_reset(registry再書込)"
source = "tmp/tasks/tm-25/design_reset_bucket_scoped.md 5章・1.3(冪等性)・2.3"
description = "registry再書込の冪等性: 除去対象0件かつtorn tail無しの再実行はregistryを書換えない(temp fileも作成しない。退避copyは実行上書き) (integration, fake seam)"
given = "混在registryでの manage reset --apply 実行後(温存行のみ残った状態・除去対象0件かつtorn tail無し)での再実行"
expect_return_shape = "exit 0で、registry内容が再実行前と完全一致(書換なし)し、退避copyは上書き実行される。S3削除呼び出しは0件"
source_lines = "tests/retention.rs:936"

[[condition]]
id = "retention.reset-registry-torn-tail"
target_function = "cli::cmd_manage_reset(registry再書込) / registry read_registry_lines(torn tail検出)"
source = "tmp/tasks/tm-25/design_reset_bucket_scoped.md 5章・1.3・2.2(torn tail)"
description = "torn write最終行(改行終端しない最終行)は退避file(全体copy)に含まれ、再書込後のregistryからは破棄される(load_registryと同解釈。退避copyに残るため証跡喪失なし。tail放置は後続appendの未完行連結=registry破損要因)。除去対象0件でもtorn tailがあれば再書込を実行する (integration, fake seam)"
given = "registry末尾に改行終端しないtorn行を追記した状態での manage reset --apply 実行(全行非対象bucket由来=除去対象0件かつtorn tail有りのcaseを含む)"
expect_return_shape = "退避fileにtorn行が含まれ、再書込後のregistryにtorn行は無く温存行のみ。除去対象0件のcaseでも再書込が実行されtorn行のみが破棄される"
source_lines = "tests/retention.rs:980"

