[[condition]]
id = "retention.prune-apply-deletes-versions"
target_function = "cli::cmd_manage_prune(削除条件式)"
source = "tmp/tasks/tm-10/design_s3_storage.md 3.2・5.2(削除条件の単一定義・11章S3-4)。TASK-18(tmp/tasks/tm-18/design_key-uuid-versioning.md 5.12・6.5): --keep廃止・keep値のaws.toml [aws.lifecycle] keep_versions一元化へ改訂"
description = "削除条件(NCVEとprune共通の単一定義): 削除対象=同一keyのnoncurrent版を新しい順に並べたとき、newer noncurrent版の数がkeep以上となった版(境界=ちょうどkeep番目に新しいnoncurrent版は残す)。keep値はaws.toml [aws.lifecycle] keep_versions(--keepオプションは廃止・当該実行での上書きは不可)。--apply時はDeleteObjectVersion (integration, fake seam)"
given = "同一keyにnoncurrent版6件ある状態で、keep_versions=5のaws.tomlでの--apply実行"
expect_return_shape = "keep=5では最古の1件のみ(newer noncurrent数5以上)削除され境界(5番目に新しいnoncurrent版)は残る。削除はDeleteObjectVersionで行われる"
source_lines = "tests/retention.rs:227"

