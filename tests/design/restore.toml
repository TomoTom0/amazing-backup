# backup-remote テスト設計条件書(restore エリア)
# 出典: tmp/tasks/tm-5/design_restore.md 3.9 RES-001〜024(本編8章 RES節・CLI仕様は本編2.7)
# 2026-10-11: TASK-5(restore系)対応で新設(テスト先行。実装前のため新条件のテストは実行failを許容し
#   [meta]はverified=falseのまま)。重要期待値(設計レビュー指摘反映済み):
#   - restore-objectの--restore-requestは 'Days=<n>,GlacierJobParameters={Tier=<tier>}' 形式
#     (shorthandのトップレベルTier=<tier>はSELECT用フィールドへ解決されるため不使用・軸3)
#   - download cpの検証optionは --checksum-mode ENABLED(--checksum-algorithm SHA256は
#     作成(upload)用optionでありdownloadでは使わない・P5)
#   - download処理順はローカル.ageのsha256照合が先行(一致ならhead-objectのRestore確認をskip・3.4-5)
#   - request時の不在nameはlist-objects-v2突合で発行前に対象エラー3(RES-023)
#   - manifest head 404は「バッチ不在」の対象エラー3+専用案内文(RES-024)
#   - request/statusの対象0件(列挙0件)は警告「当該prefixにobjectなし」+exit 0(軸7・3.2・3.3)
# 2026-10-13: TASK-9(AWS SDK移行)対応でテスト先行の更新(tmp/tasks/tm-9/design_sdk_migration.md 10.2影響条件)。
#   RES-001/003/007/014/015/020(6件)+RES-018の5系文言をSDK API呼び出し参数表現へ改訂
#   (RestoreRequest days/glacier_job_parameters tier・GetObject checksum_mode=ENABLED・
#   ListObjectsV2 paginator・SDK error→BackupError写像)。RES-020から--profileを削除(--profile廃止仕様)。
#   全条件のaws差替え表記を「fake aws PATH差替え」から「fake seam(BACKUP_REMOTE_FAKE_S3_STATE)」へ
#   変更(設計4章・10.3)。失敗注入env名(FAKE_S3_FAIL_CP_FOR等4種)は維持(10.3)。
#   idは付与後不変のため旧idのまま文言のみ改訂。実装前のため更新後期待値のテストは実行failを許容し
#   [meta]はverified=falseのまま。

[meta]
feature = "restore"
source_file = "src/restore.rs"
verified = false
test_command = "cargo test"
note = "本実装(src/restore.rs)はTASK-5実装段階で作成するためテストはbin subprocess経由の結合testのみ(テスト先行。libのrestore関数を直接参照しない)。S3実行はfake seam(env BACKUP_REMOTE_FAKE_S3_STATEで差し替わる状態を持つfake S3 backend・tests/common)で検証(実networkなし。TASK-9設計4章・10.3)。復号を含む条件は実ageバイナリ・実鍵(不在環境はskip扱い)。S3 API呼び出しの実体はsrc/s3.rsだが、source_fileはエリア主対象(src/restore.rs)を指す"

[[condition]]
id = "restore.request-restore-object-argv"
target_function = "restore::run_restore_request"
source = "tmp/tasks/tm-5/design_restore.md RES-001(本編8章。詳細は3.2・軸3)。TASK-9 SDK移行でRestoreRequest参数表現へ改訂(tmp/tasks/tm-9/design_sdk_migration.md 1章・6章・10.2)"
description = "request発行: --dateバッチ内の全key(manifest含む)へRestoreObjectが発行され、RestoreRequestはdays=<n>とglacier_job_parameters.tier=<tier>で組立される(Tier::from。SDK型のRestoreRequest{days, glacier_job_parameters{tier}})。--days/--tier指定値が反映され、省略時は既定days=7・tier=Standard。ListObjectsV2(paginator)列挙が0件の場合は警告「当該prefixにobjectなし。--date・bucketを確認」を表示してexit 0(対象なし) (integration, fake seam)"
given = "encrypt→upload済みのfake S3(objectsに<date>/{a.zip.age,b.7z.age,manifest.jsonl.age})に対するrestore request実行。--days 3 --tier Bulk指定・オプション省略・空prefixの--dateの3通り"
expect_return_shape = "RestoreObject呼び出しは3key分のみ(READMEを除く)で各呼び出し記録がdays=3・tier=Bulk(指定時)・days=7・tier=Standard(省略時)の参数を持つ。空prefixではRestoreObject発行なし・警告表示・exit 0"
source_lines = "tests/restore.rs:192"

[[condition]]
id = "restore.request-idempotent-skip"
target_function = "restore::run_restore_request"
source = "tmp/tasks/tm-5/design_restore.md RES-002(本編8章。詳細は3.2・3.8)。TASK-9 SDK移行でHeadObject表現へ改訂(設計1章)"
description = "requestの冪等: HeadObject応答のRestore(ongoing-request=\"false\"=復元済み・\"true\"=進行中)のkeyはskip表示し再発行しない。未発行(Restore無し)のkeyのみ発行する (integration, fake seam)"
given = "fake S3上でHeadObject応答のRestore状態をkeyごとに事前設定した状態(1 key復元済み・1 key進行中・manifestは未発行)でのrestore request実行"
expect_return_shape = "RestoreObject発行は未発行keyのみで、復元済み・進行中keyへの発行は起きない。skip表示あり・exit 0"
source_lines = "tests/restore.rs:265"

[[condition]]
id = "restore.request-dry-run"
target_function = "restore::run_restore_request --dry-run"
source = "tmp/tasks/tm-5/design_restore.md RES-003(本編8章。詳細は3.2・軸7)。TASK-9 SDK移行でAPI形式表示行へ改訂(設計10.1)"
description = "request --dry-run: S3 API呼び出しなし(ListObjectsV2・HeadObject・RestoreObjectすべて)。「対象key一覧は未確定(全件発行想定)」として予定行(RestoreObject API形式「[dry-run] s3 RestoreObject bucket=<b> key=<k> days=<n> tier=<tier>」・--name指定時は当該name+manifestのkey)を表示しexit 0 (integration, fake seam)"
given = "--dry-run指定のrestore request実行(fake backendは呼ばれたら呼び出し記録を残す仕掛け)"
expect_return_shape = "S3 API呼び出しは一切起きず(呼び出し記録不存在)、[dry-run]のRestoreObject予定表示が出て exit 0"
source_lines = "src/restore.rs:832; tests/restore.rs:300"

[[condition]]
id = "restore.request-tier-days-validation"
target_function = "restore::run_restore_request(事前検査)"
