description = "--tierがallowlist(Standard/Bulk。Deep Archiveで選択不可なExpeditedは含まない)外は設定エラー2・S3 API呼び出しなし。--daysが1〜365外(0・366)・非整数(abc)も設定エラー2・S3 API呼び出しなし (integration, fake seam)"
