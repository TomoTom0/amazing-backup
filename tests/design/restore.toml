[[condition]]
id = "restore.status-three-states"
target_function = "restore::run_restore_status"
source = "tmp/tasks/tm-5/design_restore.md RES-005(本編8章。詳細は3.3・軸6)。TASK-9 SDK移行でHeadObject表現へ改訂(設計1章)"
description = "status: Restoreの3状態(restored+expiry-date原文表示/ongoing/not-requested)が正しく一覧表示されexit 0。列挙0件の場合は警告「当該prefixにobjectなし。--date・bucketを確認」+exit 0(空一覧) (integration, fake seam)"
given = "fake S3上でHeadObject応答のRestore状態をkeyごとに事前設定(復元済み・進行中・未発行の混在+README)した状態でのrestore status実行。および空prefixの--dateでの実行"
expect_return_shape = "restored・ongoing・not-requestedの3分類と各keyが表示され、README行は平文・復元不要の区別表示。exit 0。空prefixでは警告表示+exit 0"
