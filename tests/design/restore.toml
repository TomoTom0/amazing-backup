id = "restore.cli-override-argv"
target_function = "cli::cmd_restore_request / cmd_restore_download(aws設定merge共用関数)"
source = "tmp/tasks/tm-5/design_restore.md RES-020(本編8章。詳細は3.1・本編2.3 TASK-6節)。TASK-9 SDK移行でAPI呼び出し参数表現へ改訂し--profileを削除(tmp/tasks/tm-9/design_sdk_migration.md 3.7・9.1・10.2)"
description = "CLI一時上書き: --bucket/--region指定時、ListObjectsV2・HeadObject・RestoreObject・GetObjectの各API呼び出しへ上書き値が反映される(bucket=<上書き値>。regionはBackend構築へ反映)。merge順(読込→require_ready→上書き適用)・検証はuploadと同一のcmd_upload共用関数による(--profileは廃止済みで存在しない) (integration, fake seam)"
given = "--bucket ov-bucket --region us-east-1指定のrestore request実行、および同指定のrestore download実行"
expect_return_shape = "ListObjectsV2・HeadObject・RestoreObject・GetObjectの各行に上書きbucket(bucket=ov-bucket)が反映される"
source_lines = "tests/restore.rs:914"

[[condition]]
id = "restore.download-output-structure"
target_function = "restore::run_restore_download"
source = "tmp/tasks/tm-5/design_restore.md RES-022(本編8章。詳細は3.6・軸5)"
description = "出力構造: <out>/<date>/{<name>.age,<name>,manifest.jsonl.age,manifest.jsonl}の配置。.ageは検証済み暗号文・平文は検証済み復元物として両方残る(平文+暗号文の約2倍のディスク使用は手順書で案内) (integration, 実age・fake seam)"
given = "2ファイル+manifestのバッチをdownloadした実行"
expect_return_shape = "<out>/<date>/配下にa.zip.age・a.zip・b.7z.age・b.7z・manifest.jsonl.age・manifest.jsonlがすべて存在する"
source_lines = "tests/restore.rs:429"

[[condition]]
id = "restore.request-name-cross-check"
target_function = "restore::run_restore_request"
source = "tmp/tasks/tm-5/design_restore.md RES-023(本編8章。詳細は3.2・軸2・軸12)。TASK-9 SDK移行でListObjectsV2/RestoreObject表現へ改訂(設計10.2)"
description = "request --name不在検出: --name指定時はListObjectsV2結果と突合し、バッチ内に存在しないname(<date>/<name>.ageが列挙結果に無い)はRestoreObject発行前に対象エラー3。--name重複指定も対象エラー3。--name絞り込み時の対象は当該name+manifest(README除外) (integration, fake seam)"
given = "upload済みバッチに対する--name ghost.zip(不在)指定・--name a.zip --name a.zip(重複)指定・--name a.zip(存在)指定の各request実行"
expect_return_shape = "不在・重複はいずれも exit 3 でRestoreObject発行なし(ListObjectsV2は実行)。--name a.zipはa.zip.ageとmanifest.jsonl.ageのみへ発行(b.7z.ageへは発行しない)"
source_lines = "tests/restore.rs:972"

[[condition]]
id = "restore.download-manifest-missing"
target_function = "restore::run_restore_download"
source = "tmp/tasks/tm-5/design_restore.md RES-024(本編8章。詳細は3.4-2・軸7)。TASK-9 SDK移行でHeadObject NotFound表現へ改訂(設計1章・8章)"
description = "manifest不在: download時のmanifest.jsonl.ageのHeadObject 404(キー不在=NotFound)は「バッチ不在(--date誤り・bucket誤り)」として対象エラー3+専用案内文「manifest.jsonl.ageが存在しない=当該バッチ不在。--dateとbucket(--aws-config・CLI一時上書き)を確認してください」 (integration, fake seam)"
given = "当該--dateのprefixにobjectが存在しない空のfake S3に対するrestore download実行"
expect_return_shape = "exit 3(対象エラー)。stderrにバッチ不在の専用案内文(manifest.jsonl.ageが存在しない)が出る"
source_lines = "tests/restore.rs:1047"

