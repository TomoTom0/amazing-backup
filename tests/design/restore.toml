description = "download一気通貫(実age統合・fake seam): manifest取得→復号→parse→全.age取得→age_sha256照合→復号→source_sha256照合まで成功する。GetObject呼び出しはchecksum_mode=ENABLED(ChecksumMode::Enabled。SDKが応答checksumを検証)で、checksum_algorithm(作成(upload)用参数)は指定しない (integration, 実age・fake seam)"
given = "encrypt→upload済み・restore request発行済み(全key復元済み)のfake S3に対するrestore download実行(--keyにrecipient秘密鍵を指定)"
expect_return_shape = "exit 0。manifest.jsonlの復号平文がbatchヘッダ+ファイルレコードとして読める。ダウンロードのGetObject呼び出し(manifest含む)はすべてchecksum_mode=ENABLED付きでchecksum_algorithmを含まない"
source_lines = "tests/restore.rs:428"

