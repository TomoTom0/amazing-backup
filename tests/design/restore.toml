# amazing-backup テスト設計条件書(restore エリア)
# 出典: tmp/tasks/tm-5/design_restore.md 3.9 RES-001〜024(本編8章 RES節・CLI仕様は本編2.7)
# 2026-10-11: TASK-5(restore系)対応で新設(テスト先行。実装前のため新条件のテストは実行failを許容し
#   [meta]はverified=falseのまま)。重要期待値(設計レビュー指摘反映済み):
#   - restore-objectの--restore-requestは 'Days=<n>,GlacierJobParameters={Tier=<tier>}' 形式
#     (shorthandのトップレベルTier=<tier>はSELECT用フィールドへ解決されるため不使用・軸3)
#   - download cpの検証optionは --checksum-mode ENABLED(--checksum-algorithm SHA256は
#     作成(upload)用optionでありdownloadでは使わない・P5)
#   - download処理順はローカル.ageのsha256照合が先行(一致ならhead-objectのRestore確認をskip・3.4-5)
#   - request時の不在nameはlist-objects-v2突合で発行前に対象エラー3(RES-023)
#   - manifest head 404は「バッチ不在」の対象エラー3+専用案内文(RES-024)
#   - request/statusの対象0件(列挙0件)は警告「当該prefixにobjectなし」+exit 0(軸7・3.2・3.3)
# 2026-10-13: TASK-9(AWS SDK移行)対応でテスト先行の更新(tmp/tasks/tm-9/design_sdk_migration.md 10.2影響条件)。
#   RES-001/003/007/014/015/020(6件)+RES-018の5系文言をSDK API呼び出し参数表現へ改訂
#   (RestoreRequest days/glacier_job_parameters tier・GetObject checksum_mode=ENABLED・
#   ListObjectsV2 paginator・SDK error→BackupError写像)。RES-020から--profileを削除(--profile廃止仕様)。
#   全条件のaws差替え表記を「fake aws PATH差替え」から「fake seam(AMAZING_BACKUP_FAKE_S3_STATE)」へ
#   変更(設計4章・10.3)。失敗注入env名(FAKE_S3_FAIL_CP_FOR等4種)は維持(10.3)。
#   idは付与後不変のため旧idのまま文言のみ改訂。実装前のため更新後期待値のテストは実行failを許容し
#   [meta]はverified=falseのまま。
# 2026-10-14: TASK-10(S3ストレージ設計)の棚卸し(tmp/tasks/tm-10/design_s3_storage.md 9章表・3.3・7.3):
#   Phase Aは旧restoreサブコマンド凍結(現行挙動=旧key=日付配置のまま)のため全条件無変更。
#   Phase Bで旧サブコマンド削除に伴いrestore.*(--date必須・prefix列挙系の全23条件)は廃止→
#   cli.get-*/cli.list-jobs/cli.backup-pull-*が引継ぎ(個別条件のsource追記・削除はPhase B作業)。
# 2026-10-15: TASK-11(Phase B)対応でテスト先行の更新(TASK-11 body+tmp/tasks/tm-10/design_s3_storage.md 7.3/9章)。
#   旧restoreサブコマンド(request/status/download)とsrc/restore.rs削除に伴う棚卸し:
#   廃止19件(引継ぎ先):
#     restore.request-restore-object-argv(--date prefix列挙→get/pullのensure_restored経路)・
#     restore.request-idempotent-skip(進行中再発行なし→cli.get-issues-restore-job)・
#     restore.request-dry-run・restore.download-dry-run(pull --dry-run・cli.backup-pull-*系)・
#     restore.status-three-states(3状態一覧→cli.list-jobs)・
#     restore.download-full-roundtrip(manifest起点一気通貫→cli.get-*/cli.backup-pull-run-scope)・
#     restore.download-name-filter・restore.request-name-cross-check(旧バッチ内--name絞り込み)・
#     restore.download-idempotent-skip・restore.download-age-refetch(旧downloadの冪等skip・.part再取得は
#     索引起点の新経路では構造が変わる)・restore.download-verification-mismatch(→cli.get-sha-mismatch-error)・
#     restore.download-requires-restored(復元未了=5→新仕様は案内+exit 0=cli.get-issues-restore-job)・
#     restore.keep-going-continues(restore系にkeep-goingは新体系に無い)・
#     restore.download-registry-independent(→cli.disaster-recovery-reads)・
#     restore.exit-codes-integration(→cli.exit-code-mapping)・restore.date-required(--date撤廃・設計3.3)・
#     restore.cli-override-argv(--bucket/--region CLI一時上書きは旧系専用→--profile=cli.profile-*へ)・
#     restore.download-output-structure(→cli.get-output-structure)・
#     restore.download-manifest-missing(旧manifest起点→索引不在はcli.index-missing-error)
#   文言改訂(廃止しない。get/pull/list jobsでも通る共通経路)3件:
#     restore.request-tier-days-validation(resolve_tier_days)・restore.restore-header-parse(Restore header
#     parse・状態判定)・restore.download-preflight-errors(--key解決・事前検査)
#   保留1件→解消: restore.download-plain-conflictは旧downloadの平文衝突保護をget/pull平文
#     衝突保護の仕様へ文言改訂(id不変・orchestrator決定。旧download仕様の継承)。
#     sha一致の既存平文はskip(冪等)・不一致は上書きせずexit 3(事故防止)・--yes指定時のみ上書き。
#   実装前のため改訂期待値のテストは実行failを許容し[meta]はverified=falseのまま。
# 2026-10-15: TASK-11(Phase B)コードレビュー指摘対応(L-5)でテスト先行の更新。
#   新規1件: restore.pull-plain-conflict-unreadable-protected(pull平文衝突で既存平文の読込失敗時も
#   --yesなしでは上書きしない=get側と同一挙動へ統一)。
# 2026-10-15: TASK-11(Phase B)再レビュー指摘対応(L-R5)でテスト先行の更新。
#   restore.pull-plain-conflict-unreadable-protectedを文言改訂: --yes=明示的上書き指示のため
#   読込不能な既存平文もget/pullとも--yes付きは上書きして続行する(get側をpull側へ統一)。

[meta]
feature = "restore"
source_file = "src/storage.rs"
verified = true
verified_at = "2026-10-22"
verified_by = "claude"
test_command = "cargo test"
source_hash = "1d7f20aba295cdb1b6862bd14605958ca4ccde61"
note = "復元job系の共通経路(tier/days検証・Restore header parse・--key事前検査)の条件群。TASK-11(Phase B)で旧restoreサブコマンド(src/restore.rs)が削除され、復元はget/backup pull/list jobs/manage jobs(src/storage.rs)経路で検証する(旧CLI固有の条件は廃止済み)。S3実行はfake seam(env AMAZING_BACKUP_FAKE_S3_STATE・tests/common)で検証(実networkなし)"

[[condition]]
id = "restore.request-tier-days-validation"
target_function = "storage::resolve_tier_days(get/pull共通事前検査)"
source = "tmp/tasks/tm-5/design_restore.md RES-004(本編8章。詳細は3.1・軸3)。TASK-9 SDK移行でS3 API呼び出しへの文言改訂(設計10.2)。TASK-11(Phase B): 旧restore削除によりget/pull共通経路へ文言改訂(終了コードはPhase A実装の実挙動に一致: tier=usage 64・days=設定エラー2)"
description = "--tierがallowlist(Standard/Bulk。Deep Archiveで選択不可なExpeditedは含まない)外はusage error 64・S3 API呼び出しなし。--daysが1〜365外(0・366)は設定エラー2・S3 API呼び出しなし(get/pull共通の事前検査) (integration, fake seam)"
given = "--tier Expedited指定・--days 0・--days 366の各指定での get・backup pull 実行"
expect_return_shape = "--tier不正は exit 64・--days不正は exit 2 で、いずれもfake backendの呼び出し記録不存在(S3 API呼び出し前に検出)"
source_lines = "tests/restore.rs:16"

[[condition]]
id = "restore.restore-header-parse"
target_function = "storage::restore_state / storage::ensure_restored(Restore parse)"
source = "tmp/tasks/tm-5/design_restore.md RES-006(本編8章。詳細は3.8)。TASK-9 SDK移行でHeadObject応答表現へ改訂(設計1章・6章)。TASK-11(Phase B): 旧restore削除によりget/pull/list jobs共通経路へ文言改訂"
description = "Restore parse: 値なし(HeadObject応答にRestore無し)=NotRequested・ongoing-request=\"true\"=Ongoing・ongoing-request=\"false\"=Restoredへ分類する。判定はRestore値の原文ベースで行い、expiry-dateの時刻変換・JST変換はしない(get/pullの復元要否判定・list jobsの状態表示の共通基盤) (integration, fake seam・list jobs表示経由)"
given = "fake backendのHeadObject応答へ固定のRestore値(ongoing-request=\"false\", expiry-date=\"Wed, 14 Oct 2026 00:00:00 GMT\"・ongoing-request=\"true\"・なし)をkeyごとに返す状態での list jobs 実行"
expect_return_shape = "restored・ongoing・not-requestedの3分類が正しく表示される。expiry-date等の解析・時刻変換を前提としない(原文の部分一致判定のみ)"
source_lines = "tests/restore.rs:61"

[[condition]]
id = "restore.download-preflight-errors"
target_function = "storage::resolve_key(get/pull事前検査)"
source = "tmp/tasks/tm-5/design_restore.md RES-016(本編8章。詳細は3.4-1・3.1注記)。TASK-9 SDK移行でS3 API呼び出しへの文言改訂(設計10.2)。TASK-11(Phase B): 旧restore削除によりget/pull共通経路へ文言改訂"
description = "get/pull事前検査(設定エラー2・対象処理に紛れない): --key未指定かつ[verify].decrypt_keyも解決不能(pipeline.toml不在含む)・--keyの鍵ファイル不在・ageバイナリ不在は、いずれもS3 API呼び出し(索引GET含む)前にexit 2 (integration, fake seam)"
given = "pipeline.toml不在の作業dirでの--key未指定get実行。--keyに不在pathを指定した実行。PATHからageを除外した実行"
expect_return_shape = "いずれも exit 2 でfake backendの呼び出し記録不存在(索引GET等の対象処理前に検出)"
source_lines = "tests/restore.rs:107"

[[condition]]
id = "restore.download-plain-conflict"
target_function = "storage::cmd_get / cmd_backup_pull(出力先書込の平文衝突保護)"
source = "tmp/tasks/tm-5/design_restore.md RES-011(本編8章。詳細は3.4-5d・軸5)。TASK-11(Phase B): orchestrator決定により旧download経路の平文衝突保護をget/pull経路の仕様として引き継ぎ(文言改訂・id不変)"
description = "平文衝突保護(get/pull出力先): 出力先に既存平文がありそのsha256が取得対象のsource_sha256と一致する場合はskip(冪等・上書きしない)。不一致の場合は事故防止として上書きせず対象エラー3(手動リネームを促す)。--yes指定時のみ上書きする。復元成果物である平文は検証済み復元物として保守的に扱う(.ageの中間生成物とは扱いが異なる) (integration, 実age・fake seam)"
given = "get(またはbackup pull)の出力先に改変済みの既存平文(sha256不一致)を事前配置した実行・sha256一致の既存平文を事前配置した実行・--yes付きの再実行"
expect_return_shape = "不一致はexit 3で既存平文は事前配置の内容から不変(上書きしない)。一致はskip表示+exit 0(冪等)。--yes付きは上書きしてexit 0"
source_lines = "tests/restore.rs:170"

[[condition]]
id = "restore.pull-plain-conflict-unreadable-protected"
target_function = "storage::cmd_get / cmd_backup_pull(平文衝突・読込失敗時の保護)"
source = "TASK-11(Phase B)コードレビュー指摘L-5+再レビュー指摘L-R5+restore.download-plain-conflict(get/pull同一規則)"
description = "get/backup pullの平文衝突保護で既存平文の読込が失敗する(sha256検証不能)場合も、--yesなしでは上書きせず対象エラー3として保護する(検証不能な既存平文の黙示上書きをしない)。--yesは明示的上書き指示のため、get/pullとも読込不能な既存平文を上書きして続行する(L-R5: 旧get側の--yesでもexit 3をpull側の上書き許可へ統一) (integration, 実age・fake seam・pty)"
given = "get・backup pullの出力先に読込不能(chmodで読込権限を除去)な既存平文を配置した状態での、--yesなし(getはそのまま・pullは確認をTTY入力で通す)と--yes付きの各実行"
expect_return_shape = "--yesなしは exit 3(対象エラー)で既存平文のpath・読込失敗の案内が表示され、上書き(取得・書込)は行われない。--yes付きは取得・上書きして exit 0(get/pullとも同一挙動)"
source_lines = "tests/restore.rs:234"

