[[condition]]
id = "restore.restore-header-parse"
target_function = "restore::RestoreState(Restore parse)"
source = "tmp/tasks/tm-5/design_restore.md RES-006(本編8章。詳細は3.8)。TASK-9 SDK移行でHeadObject応答表現へ改訂(設計1章・6章)"
description = "Restore parse: 値なし(HeadObject応答にRestore無し)=NotRequested・ongoing-request=\"true\"=Ongoing・ongoing-request=\"false\"=Restoredへ分類し、expiry-dateはRFC 7231 HTTP-dateのraw文字列をそのまま保持する(解析・時刻変換・JST変換をしない) (integration, fake seam・status表示経由)"
given = "fake backendのHeadObject応答へ固定のRestore値(ongoing-request=\"false\", expiry-date=\"Wed, 14 Oct 2026 00:00:00 GMT\"・ongoing-request=\"true\"・なし)をkeyごとに返す状態でのrestore status実行"
expect_return_shape = "status出力にexpiry-dateのraw文字列(Wed, 14 Oct 2026 00:00:00 GMT)が原文どおり含まれ、JST変換(+09:00等)・時刻解析を施した形では表示されない。3状態が正しく分類表示される"
source_lines = "src/restore.rs:794; tests/restore.rs:396"

[[condition]]
id = "restore.download-full-roundtrip"
target_function = "restore::run_restore_download"
