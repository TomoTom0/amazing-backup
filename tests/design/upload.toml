[meta]
feature = "upload"
source_file = "src/uploader.rs"
verified = false
verified_at = "2026-10-09"
verified_by = "claude"
test_command = "cargo test"
source_hash = "c3b4dfed918c313962d4d827afd9711c18a2ba5c"
note = "全条件でS3実行はS3Backend traitをfake(FakeS3)に差し替えて検証する(実networkなし。TASK-9設計4章・8章)。skip判定行列(2.3-3)はdecide_skipの単体試験で網羅する。S3 API呼び出し(RealS3・FakeS3)の実体はsrc/s3.rsだが、source_fileはエリア主対象(src/uploader.rs)を指し、実関数はtarget_functionで特定する(config.tomlのCONF-005と同一運用)"

