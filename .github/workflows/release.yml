name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # TASK-9設計10章(release CI先行job): frontend buildを1回実行しdistをartifact共有。
  # matrix build jobはdownloadしたdistを埋め込む(rust-embed)。repoにはdistをcommitしない
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: build frontend dist
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          if-no-files-found: error

  build:
    needs: frontend
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            use-cross: false
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            use-cross: true
          - os: macos-latest
            target: aarch64-apple-darwin
            use-cross: false
          - os: macos-latest
            target: x86_64-apple-darwin
            use-cross: false
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      # frontend先行jobのbuild済みdist(rust-embedがfrontend/distを埋め込む)
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
      - name: build
        run: |
          if [ "${{ matrix.use-cross }}" = "true" ]; then
            cargo install cross --locked
            cross build --release --locked --target ${{ matrix.target }}
          else
            cargo build --release --locked --target ${{ matrix.target }}
          fi
      - name: package
        run: |
          dir="amazing-backup-${{ matrix.target }}"
          mkdir -p "pkg/$dir/bin"
          cp "target/${{ matrix.target }}/release/amazing-backup" "pkg/$dir/bin/"
          cp README.md LICENSE "pkg/$dir/"
          tar -czf "amazing-backup-${{ matrix.target }}.tar.gz" -C pkg "$dir"
          sha256sum "amazing-backup-${{ matrix.target }}.tar.gz" > "amazing-backup-${{ matrix.target }}.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: amazing-backup-${{ matrix.target }}
          path: amazing-backup-${{ matrix.target }}.tar.gz*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate-release-notes: true
