# aws.tomlのtemplate。`amazing-backup config init`がこの内容を規定path
# (~/.config/amazing-backup/aws.toml)へ生成する(XDG配置・TASK-19。
# $XDG_CONFIG_HOME設定時は $XDG_CONFIG_HOME/amazing-backup/aws.toml)。
# initは各profileのcredentials_file値(marker)を生成したcredential雛形
# ($config_dir/aws-credentials.toml)の絶対pathへ置換する。手動でこのfileを
# 配置する場合はcredentials_fileを実pathへ書き換えること(markerのままでは使えない)。
# 各keyの意味は docs/usage_backup.md 3.2 を参照。

[aws]
active_profile = "dev"

# lifecycle(TASK-18 7章・全profile共通。manage lifecycle applyが適用する3ruleの値)
# noncurrent_days: NCVE NoncurrentDays(DEEP_ARCHIVEは180以上必須)
# keep_versions:   NCVE NewerNoncurrentVersions(保持するnoncurrent版数)
# mpu_abort_days:  AbortIncompleteMultipartUpload日数
[aws.lifecycle]
noncurrent_days = 180
keep_versions = 10
mpu_abort_days = 7

[aws.profiles.dev]
purpose = "dev"
bucket = "<dev-bucket>"
region = "ap-northeast-1"
prefix = "amazing-backup/"
storage_class = "STANDARD"
credentials_file = "__CREDENTIALS_FILE__"

# prod系は用途別bucketの並列profile例(同一credentials_file共用)
[aws.profiles.family]
purpose = "prod"
bucket = "<prod-bucket-1>"
region = "ap-northeast-1"
prefix = "amazing-backup/"
storage_class = "DEEP_ARCHIVE"
credentials_file = "__CREDENTIALS_FILE__"
